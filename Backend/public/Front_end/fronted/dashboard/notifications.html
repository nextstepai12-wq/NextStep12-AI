<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإشعارات — لوحة تحكم الإدارة | NextStep AI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../css/app.css">
  <link rel="stylesheet" href="../../css/dashboardcss/admin-shell.css">
  <link rel="stylesheet" href="../../css/dashboardcss/notifications.css">
</head>
<body>

<header class="admin-topbar" id="adminTopbar"></header>

<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <main class="admin-main admin-main-content">

    <!-- ===== PAGE HEADER ===== -->
    <div class="admin-page-head">
      <div>
        <h1>الإشعارات</h1>
        <p>جميع التنبيهات والإشعارات الصادرة من النظام.</p>
      </div>
      <div class="header-actions">
        <button type="button" class="pill-btn" id="markAllReadBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
          تحديد الكل كمقروء
        </button>
        <button type="button" class="pill-btn danger" id="clearAllBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          حذف الكل
        </button>
      </div>
    </div>

    <!-- ===== TABS ===== -->
    <div class="notif-tabs">
      <button type="button" class="notif-tab active" data-filter="all">
        الكل <span class="badge" id="countAll">0</span>
      </button>
      <button type="button" class="notif-tab" data-filter="unread">
        غير المقروء <span class="badge" id="countUnread">0</span>
      </button>
    </div>

    <!-- ===== LIST ===== -->
    <div class="notif-list" id="notifList">
      <!-- سيتم تعبئته بواسطة JavaScript -->
    </div>

  </main>
</div>

<div id="admin-footer-slot"></div>
<script src="../../js/admin-shell.js"></script>

<script>
  (function() {
    'use strict';

    var notifList = document.getElementById('notifList');
    var countAll = document.getElementById('countAll');
    var countUnread = document.getElementById('countUnread');
    var markAllBtn = document.getElementById('markAllReadBtn');
    var clearAllBtn = document.getElementById('clearAllBtn');
    var tabs = document.querySelectorAll('.notif-tab');
    var currentFilter = 'all';

    // ================================================================
    // RENDER
    // ================================================================
    function renderNotifications(filter) {
      var notifs = window.NextStepNotifications.getNotifications();
      var filtered = filter === 'unread' ? notifs.filter(function(n) { return !n.read; }) : notifs;

      // تحديث العدادات
      countAll.textContent = notifs.length;
      countUnread.textContent = notifs.filter(function(n) { return !n.read; }).length;

      if (!filtered.length) {
        notifList.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <h4>لا توجد إشعارات</h4>
            <p>جميع الإشعارات قد تمت قراءتها أو لا توجد إشعارات جديدة.</p>
          </div>
        `;
        return;
      }

      var html = '';
      filtered.forEach(function(n) {
        var iconMap = {
          info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
          success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>',
          warning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/></svg>',
          error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>'
        };
        var icon = iconMap[n.type] || iconMap.info;
        var typeClass = n.type || 'info';

        html += `
          <div class="notif-item ${n.read ? 'read' : 'unread'}" data-id="${n.id}">
            <div class="notif-icon ${typeClass}">${icon}</div>
            <div class="notif-content">
              <div class="notif-header">
                <strong>${n.title}</strong>
                <span class="notif-time">${n.time}</span>
              </div>
              <p>${n.message}</p>
            </div>
            <div class="item-actions">
              ${!n.read ? `<button type="button" class="mark-read" title="تحديد كمقروء"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></button>` : ''}
              <button type="button" class="delete" title="حذف"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
            </div>
          </div>
        `;
      });

      notifList.innerHTML = html;

      // ===== ربط الأحداث =====
      // زر "تحديد كمقروء"
      document.querySelectorAll('.mark-read').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var item = this.closest('.notif-item');
          var id = parseInt(item.dataset.id);
          window.NextStepNotifications.markAsRead(id);
          renderNotifications(currentFilter);
        });
      });

      // زر "حذف"
      document.querySelectorAll('.delete').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var item = this.closest('.notif-item');
          var id = parseInt(item.dataset.id);
          if (confirm('هل أنت متأكد من حذف هذا الإشعار؟')) {
            window.NextStepNotifications.deleteNotification(id);
            renderNotifications(currentFilter);
          }
        });
      });

      // النقر على العنصر غير المقروء لتحديده كمقروء
      document.querySelectorAll('.notif-item.unread').forEach(function(item) {
        item.addEventListener('click', function() {
          var id = parseInt(this.dataset.id);
          window.NextStepNotifications.markAsRead(id);
          renderNotifications(currentFilter);
        });
      });
    }

    // ================================================================
    // EVENTS
    // ================================================================
    markAllBtn.addEventListener('click', function() {
      if (confirm('هل أنت متأكد من تحديد جميع الإشعارات كمقروءة؟')) {
        window.NextStepNotifications.markAllAsRead();
        renderNotifications(currentFilter);
      }
    });

    clearAllBtn.addEventListener('click', function() {
      if (confirm('هل أنت متأكد من حذف جميع الإشعارات؟')) {
        window.NextStepNotifications.clearAllNotifications();
        renderNotifications(currentFilter);
      }
    });

    tabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        tabs.forEach(function(t) { t.classList.remove('active'); });
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        renderNotifications(currentFilter);
      });
    });

    // ================================================================
    // INIT
    // ================================================================
    renderNotifications('all');

  })();
</script>

</body>
</html>
