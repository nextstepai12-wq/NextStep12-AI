<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تم إرسال رابط الاستعادة — NextStep AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="../css/app.css" rel="stylesheet">
<link href="../css/header.css" rel="stylesheet">
<link href="../css/signup.css" rel="stylesheet">
<link href="../css/footer.css" rel="stylesheet">
</head>
<body>

<!-- ======================= HEADER ======================= -->
<script src="../js/header-index.js"></script>

<!-- ======================= AUTH CARD (حالة نجاح) ======================= -->
<div class="auth-wrap">
  <div class="auth-card auth-card-center">

    <div class="success-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
    </div>

    <h1 class="auth-title">تم إرسال رابط الاستعادة!</h1>
    <p class="auth-subtitle" id="sentSubtitle">لقد أرسلنا بريداً إلكترونياً يحتوي على رابط لإعادة تعيين كلمة المرور. يرجى التحقق من بريدك الوارد.</p>

    <a href="login.html" class="btn-submit" style="margin-bottom:12px; text-decoration:none;">
      العودة لتسجيل الدخول
    </a>

    <button type="button" class="btn-outline-full" id="resendBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      إعادة إرسال الرابط
    </button>

    <p class="auth-footer-text">لم يصلك البريد؟ تأكد من مجلد الرسائل غير الهامة (Spam)</p>
  </div>
</div>

<script>
  const API_BASE_URL = 'http://127.0.0.1:8000/api';

  const urlParams = new URLSearchParams(window.location.search);
  const sentEmail = urlParams.get('email');

  const sentSubtitle = document.getElementById('sentSubtitle');
  if (sentEmail) {
    sentSubtitle.textContent = `أرسلنا رابط إعادة تعيين كلمة المرور إلى ${sentEmail}. يرجى التحقق من بريدك الوارد.`;
  }

  const resendBtn = document.getElementById('resendBtn');

  const alertBox = document.createElement('div');
  alertBox.id = 'resendAlert';
  alertBox.style.cssText = 'display:none;margin-bottom:16px;padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;';
  resendBtn.insertAdjacentElement('afterend', alertBox);

  function showAlert(message, type) {
    alertBox.textContent = message;
    alertBox.style.display = 'block';
    if (type === 'error') {
      alertBox.style.background = '#FDEDEE';
      alertBox.style.color = '#C62828';
    } else {
      alertBox.style.background = 'rgba(72,230,176,0.12)';
      alertBox.style.color = '#1C8F63';
    }
  }

  resendBtn.addEventListener('click', async function () {
    if (!sentEmail) {
      showAlert('تعذر تحديد الإيميل، رجعي لصفحة "نسيت كلمة المرور" وحاول مرة ثانية', 'error');
      return;
    }

    resendBtn.disabled = true;
    const originalContent = resendBtn.innerHTML;
    resendBtn.textContent = 'جارٍ إعادة الإرسال...';
    alertBox.style.display = 'none';

    try {
      const response = await fetch(`${API_BASE_URL}/forgot-password`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json',
        },
        body: JSON.stringify({ email: sentEmail }),
      });

      const data = await response.json();

      if (response.ok && data.status === 'success') {
        showAlert('تم إعادة إرسال الرابط بنجاح', 'success');
      } else {
        showAlert(data.message || 'تعذر إعادة إرسال الرابط، حاولي لاحقاً', 'error');
      }
    } catch (err) {
      showAlert('تعذر الاتصال بالسيرفر. تأكدي إنه الباك اند شغال.', 'error');
      console.error('Resend link error:', err);
    } finally {
      resendBtn.disabled = false;
      resendBtn.innerHTML = originalContent;
    }
  });
</script>

<!-- ======================= FOOTER ======================= -->

<script src="../js/footer-index.js"></script>
</body>
</html>
