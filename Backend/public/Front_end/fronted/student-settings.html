  <!-- ===== MAIN ===== -->
  <main class="student-main">
    <div class="page">
      <div class="brand-row"></div>

      <div class="card">
        <h1>تعديل الملف الشخصي</h1>
        <p class="subtitle">حدّث بياناتك الشخصية وصورتك لتظل معلوماتك دقيقة ومحدّثة</p>

        <form onsubmit="return false;" id="settingsForm">
          <div class="field">
            <label for="fullname">الاسم الكامل</label>
            <input type="text" id="fullname" value="أحمد محمد">
          </div>

          <div class="field">
            <label for="email">البريد الإلكتروني</label>
            <input type="email" id="email" value="ahmed.mohammed@example.com" dir="ltr" style="text-align:right;">
          </div>

          <div class="field">
            <label for="phone">رقم الهاتف</label>
            <input type="tel" id="phone" value="‎+970 59 123 4567" dir="ltr" style="text-align:right;">
          </div>

          <div class="field">
            <label for="city">المدينة</label>
            <div class="select-wrap">
              <select id="city">
                <option>نابلس</option>
                <option>رام الله</option>
                <option>الخليل</option>
                <option>غزة</option>
                <option>بيت لحم</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="birthdate">تاريخ الميلاد</label>
            <div class="date-wrap">
              <input type="text" id="birthdate" value="2003 / 05 / 18">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </div>
          </div>

          <div class="field">
            <label for="gender">الجنس</label>
            <div class="select-wrap">
              <select id="gender">
                <option>ذكر</option>
                <option>أنثى</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="nationality">الجنسية</label>
            <div class="select-wrap">
              <select id="nationality">
                <option>فلسطينية</option>
                <option>أردنية</option>
                <option>مصرية</option>
                <option>سعودية</option>
                <option>إماراتية</option>
                <option>أخرى</option>
              </select>
            </div>
          </div>

          <button class="save-btn" type="submit" id="saveBtn">حفظ التغييرات</button>
        </form>

        <div class="photo-panel">
          <div class="avatar-ring">
            <img id="avatarImg" src="https://images.unsplash.com/photo-1618077360395-f3068be8e001?w=300&h=300&fit=crop&crop=faces" alt="الصورة الشخصية">
          </div>
          <label class="change-photo-btn" for="photo-upload" id="changePhotoBtn">تغيير الصورة</label>
          <input type="file" id="photo-upload" accept="image/png, image/jpeg">
          <input type="file" id="avatarInput" accept="image/png, image/jpeg" style="display:none;">
          <p class="photo-hint">الصيغة المسموحة: JPG, PNG<br>أقصى حجم للملف: 2MB</p>
        </div>
      </div>

<!-- ===== SCRIPTS ===== -->
<script>
  (function() {
    const topbar = document.getElementById('topbar');
    window.addEventListener('scroll', function() {
      topbar?.classList.toggle('scrolled', window.scrollY > 20);
    }, { passive: true });
  })();

  const avatarInput = document.getElementById('avatarInput');
  const avatarImg = document.getElementById('avatarImg');
  const photoUpload = document.getElementById('photo-upload');
  const changePhotoBtn = document.getElementById('changePhotoBtn');

  [photoUpload, avatarInput].forEach(input => {
    input.addEventListener('change', () => {
      const file = input.files[0];
      if (file) {
        avatarImg.src = URL.createObjectURL(file);
      }
    });
  });

  const form = document.getElementById('settingsForm');
  const saveBtn = document.getElementById('saveBtn');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const originalText = saveBtn.innerHTML;
    saveBtn.innerHTML = `✓ تم الحفظ`;
    setTimeout(() => { saveBtn.innerHTML = originalText; }, 2200);
  });
</script>
