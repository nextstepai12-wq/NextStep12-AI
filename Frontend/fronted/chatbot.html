<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المساعد الذكي — NextStep AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="../css/app.css" rel="stylesheet">
<link href="../css/header.css" rel="stylesheet">
<link href="../css/chatbot.css" rel="stylesheet">
</head>
<body>

<!-- ======================= HEADER ======================= -->

<script src="../js/header-index.js"></script>

<!-- ======================= CHAT TOP BAR ======================= -->
<div class="chat-topbar">
  <div class="chat-topbar-inner">
    <div class="chat-bot-avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="12" rx="3"/><path d="M12 8V4M8 4h8"/><circle cx="8.5" cy="14" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="14" r="1.2" fill="currentColor" stroke="none"/></svg>
    </div>
    <div>
      <h1>المساعد الذكي</h1>
      <p><span class="status-dot"></span> متصل الآن — جاهز يساعدك</p>
    </div>
  </div>
</div>

<!-- ======================= CHAT AREA ======================= -->
<div class="chat-wrap">

  <div class="chat-messages" id="chatMessages">
    <div class="msg-row bot">
      <div class="msg-avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="12" rx="3"/><path d="M12 8V4M8 4h8"/><circle cx="8.5" cy="14" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="14" r="1.2" fill="currentColor" stroke="none"/></svg>
      </div>
      <div class="msg-bubble">أهلاً فيك! 👋 أنا المساعد الذكي تبع NextStep AI. اسألني عن اختيار التخصص، الجامعات، أو أي شي متعلق برحلتك الجامعية.</div>
    </div>
  </div>

  <div class="suggestions-wrap" id="suggestionsWrap">
    <div class="suggestions-title">أسئلة مقترحة تقدر تبدأ فيها:</div>
    <div class="suggestions-grid">
      <button class="suggestion-chip" data-q="كيف بختار التخصص المناسب؟">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.6.5 1 1.3 1 2.1V17h6v-1.4c0-.8.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
        كيف بختار التخصص المناسب؟
      </button>
      <button class="suggestion-chip" data-q="وش أفضل جامعة قريبة مني؟">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M9 17h1M14 17h1"/></svg>
        وش أفضل جامعة قريبة مني؟
      </button>
      <button class="suggestion-chip" data-q="كيف أعرف نسبة توافقي مع تخصص معين؟">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 9 9"/></svg>
        كيف أعرف نسبة التوافق؟
      </button>
      <button class="suggestion-chip" data-q="كيف أبدأ الاستبيان الذكي؟">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
        كيف أبدأ الاستبيان الذكي؟
      </button>
    </div>
  </div>

  <div class="chat-input-bar">
    <input type="text" id="chatInput" placeholder="اكتب سؤالك هون...">
    <button class="chat-send-btn" id="sendBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>

</div>
<script src="../js/footer-index.js"></script>

<!-- ======================= FOOTER ======================= -->


<script>
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const suggestionsWrap = document.getElementById('suggestionsWrap');

const botIconSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="12" rx="3"/><path d="M12 8V4M8 4h8"/><circle cx="8.5" cy="14" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="14" r="1.2" fill="currentColor" stroke="none"/></svg>`;

function addUserMessage(text){
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `
    <div class="msg-avatar">أنا</div>
    <div class="msg-bubble"></div>
  `;
  row.querySelector('.msg-bubble').textContent = text;
  chatMessages.appendChild(row);
  scrollToBottom();
}

function addBotMessage(text){
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.innerHTML = `
    <div class="msg-avatar">${botIconSvg}</div>
    <div class="msg-bubble"></div>
  `;
  row.querySelector('.msg-bubble').textContent = text;
  chatMessages.appendChild(row);
  scrollToBottom();
}

function showTyping(){
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.id = 'typingRow';
  row.innerHTML = `
    <div class="msg-avatar">${botIconSvg}</div>
    <div class="msg-bubble typing-bubble">
      <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
    </div>
  `;
  chatMessages.appendChild(row);
  scrollToBottom();
}

function removeTyping(){
  const row = document.getElementById('typingRow');
  if (row) row.remove();
}

function scrollToBottom(){
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

/* ردود مبنية على كلمات مفتاحية بسيطة — لاحقاً هتنستبدل بربط حقيقي مع محرك ذكاء اصطناعي عبر API */
function getBotReply(message){
  const msg = message.toLowerCase();

  if (msg.includes('تخصص')){
    return 'اختيار التخصص بيعتمد على ميولك ومهاراتك ومعدلك. أفضل طريقة إنك تبدئي الاستبيان الذكي عندنا، وبطلعلك أقرب التخصصات المناسبة لشخصيتك بدقة.';
  }
  if (msg.includes('جامع')){
    return 'عندنا دليل شامل لأكثر من 50 جامعة تقدري تفلتري فيه حسب المدينة والقطاع (حكومية/خاصة). زوري صفحة "الجامعات" من القائمة فوق.';
  }
  if (msg.includes('توافق') || msg.includes('نسبة')){
    return 'نسبة التوافق بتحسب من إجاباتك بالاستبيان الذكي (ميولك، مهاراتك، معدلك) مقارنة ببيانات كل تخصص وجامعة. بتلاقيها واضحة بصفحة "النتائج" بعد ما تخلصي الاستبيان.';
  }
  if (msg.includes('استبيان') || msg.includes('اختبار')){
    return 'تقدري تبدئي الاستبيان الذكي مباشرة من الصفحة الرئيسية، زر "ابدأ الاختبار الذكي" — بياخد منك بس كم دقيقة!';
  }
  if (msg.includes('معدل')){
    return 'المعدل من أهم العوامل يلي بتأثر على نسبة توافقك مع التخصصات. تقدري تدخليه بحسابك من صفحة "إنشاء الحساب" أو الملف الشخصي.';
  }
  if (msg.includes('مرحبا') || msg.includes('اهلا') || msg.includes('هاي')){
    return 'أهلاً فيك! كيف أقدر أساعدك اليوم؟ 😊';
  }
  if (msg.includes('شكر')){
    return 'العفو! 🌟 إذا في أي سؤال تاني أنا هون.';
  }

  return 'شكراً لسؤالك! هالميزة (الرد الذكي الكامل) لسا قيد التطوير وبتنربط قريباً بمحرك ذكاء اصطناعي حقيقي. بالوقت الحالي جربي تسألي عن: التخصص، الجامعات، نسبة التوافق، أو الاستبيان الذكي.';
}

function handleSend(){
  const text = chatInput.value.trim();
  if (!text) return;

  suggestionsWrap.style.display = 'none';
  addUserMessage(text);
  chatInput.value = '';
  sendBtn.disabled = true;

  showTyping();
  setTimeout(() => {
    removeTyping();
    addBotMessage(getBotReply(text));
    sendBtn.disabled = false;
  }, 800 + Math.random() * 500);
}

sendBtn.addEventListener('click', handleSend);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') handleSend();
});

document.querySelectorAll('.suggestion-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    chatInput.value = chip.dataset.q;
    handleSend();
  });
});
</script>

</body>
</html>
