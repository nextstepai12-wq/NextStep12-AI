<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استعراض العمادات والتخصصات — لوحة تحكم الإدارة | NextStep AI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- ====== CSS المشترك ====== -->
  <link rel="stylesheet" href="../../css/app.css">
  <link rel="stylesheet" href="../../css/dashboardcss/admin-shell.css">
  <link rel="stylesheet" href="../../css/dashboardcss/programs.css">
  <link rel="stylesheet" href="../../css/dashboardcss/browsedeanships.css">

</head>
<body>

<!-- ======================= TOP BAR ======================= -->
<header class="admin-topbar" id="adminTopbar"></header>

<!-- ======================= LAYOUT ======================= -->
<div class="admin-layout">

  <!-- ====== SIDEBAR ====== -->
  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <!-- ====== MAIN CONTENT ====== -->
  <main class="admin-main admin-main-content">

    <!-- ====== PAGE HEADER ====== -->
    <div class="admin-page-head">
      <div>
        <h1>استعراض العمادات والتخصصات</h1>
        <p>تصفّحي كل العمادات المسجّلة، ادخلي على أي عمادة لعرض تخصصاتها، وبضغطة وحدة شوفي الخطة الدراسية الكاملة لأي تخصص.</p>
      </div>
    </div>

    <!-- ====== STEPPER (عرض فقط) ====== -->
    <div class="admin-steps" id="stepsRow">
      <button type="button" class="admin-step-card active" data-step="1" id="stepBtn1">
        <span class="step-label">العمادات<br><small>الخطوة الأولى</small></span>
        <span class="step-num">1</span>
      </button>
      <button type="button" class="admin-step-card" data-step="2" id="stepBtn2">
        <span class="step-label">التخصصات<br><small>الخطوة الثانية</small></span>
        <span class="step-num">2</span>
      </button>
      <button type="button" class="admin-step-card" data-step="3" id="stepBtn3">
        <span class="step-label">الخطة الدراسية<br><small>الخطوة الثالثة</small></span>
        <span class="step-num">3</span>
      </button>
    </div>

    <!-- ====== BREADCRUMB TRAIL ====== -->
    <div class="browse-trail" id="browseTrail"></div>

    <!-- =========================================================
         STEP 1 — DEANSHIPS
    ========================================================== -->
    <section class="browse-step active" id="stepDeanships">

      <div class="admin-panel">

        <div class="browse-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"/>
            <path d="M21 21l-4.3-4.3"/>
          </svg>
          <input type="text" id="deanshipSearchInput" placeholder="ابحثي عن عمادة...">
        </div>

        <div class="deanship-grid" id="deanshipGrid"><!-- يتم تعبئتها بـ JS --></div>

      </div>

    </section>

    <!-- =========================================================
         STEP 2 — MAJORS
    ========================================================== -->
    <section class="browse-step" id="stepMajors">

      <div class="admin-panel">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:16px;" id="majorsPanelTitle">تخصصات العمادة</h3>
        <div class="major-grid" id="majorGrid"><!-- يتم تعبئتها بـ JS --></div>
      </div>

    </section>

    <!-- =========================================================
         STEP 3 — STUDY PLAN
    ========================================================== -->
    <section class="browse-step" id="stepPlan">

      <div class="admin-panel">

        <div class="plan-head">
          <div>
            <h2 id="planMajorName">—</h2>
            <div class="plan-sub" id="planMajorSub">—</div>
          </div>

          <div class="plan-actions" id="planActions">

            <button type="button" class="plan-action-btn" id="editMajorBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/>
              </svg>
              تعديل البيانات الأساسية
            </button>

            <button type="button" class="plan-action-btn" id="updatePlanBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <path d="M17 8l-5-5-5 5"/>
                <path d="M12 3v12"/>
              </svg>
              تحديث الخطة الدراسية
            </button>

            <button type="button" class="plan-download-btn" id="planDownloadBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <path d="M7 10l5 5 5-5"/>
                <path d="M12 15V3"/>
              </svg>
              عرض الملف الأصلي المرفوع
            </button>

          </div>
        </div>

        <div class="plan-stats" id="planStats"><!-- يتم تعبئتها بـ JS --></div>

        <div class="plan-goals" id="planGoals"></div>

        <div class="plan-skills-block" id="planSkillsBlock" hidden>
          <h3 class="plan-skills-title">المهارات المستهدفة</h3>
          <div class="plan-skills-chips" id="planSkillsChips"></div>
        </div>

        <div id="planSemesters"><!-- يتم تعبئتها بـ JS --></div>

      </div>

    </section>

  </main>
</div>

<!-- ======================= MODAL ======================= -->
<div class="app-modal-overlay" id="appModalOverlay">
  <div class="app-modal" role="alertdialog" aria-modal="true" aria-labelledby="appModalTitle" aria-describedby="appModalMsg">
    <div class="app-modal-icon" id="appModalIcon"></div>
    <h3 class="app-modal-title" id="appModalTitle"></h3>
    <p class="app-modal-msg" id="appModalMsg"></p>
    <div class="app-modal-actions" id="appModalActions"></div>
  </div>
</div>

<!-- ======================= SCRIPTS ======================= -->
<script>
(function () {
  'use strict';

  const USE_MOCK_DATA = true;

  /* ============================================================
     MODAL — نفس الأسلوب المستخدم بباقي صفحات لوحة التحكم
  ============================================================= */
  const modalOverlay = document.getElementById('appModalOverlay');
  const modalIcon = document.getElementById('appModalIcon');
  const modalTitle = document.getElementById('appModalTitle');
  const modalMsg = document.getElementById('appModalMsg');
  const modalActions = document.getElementById('appModalActions');

  const MODAL_ICONS = {
    success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>',
    error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'
  };

  function closeModal() {
    modalOverlay.classList.remove('is-open');
  }

  function openModal({ type = 'info', title = '', message = '', confirmText = 'تمام' }) {
    modalIcon.className = 'app-modal-icon ' + type;
    modalIcon.innerHTML = MODAL_ICONS[type] || MODAL_ICONS.info;
    modalTitle.textContent = title;
    modalMsg.textContent = message;
    modalActions.innerHTML = '';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'app-modal-btn';
    btn.textContent = confirmText;
    btn.addEventListener('click', closeModal);
    modalActions.appendChild(btn);

    modalOverlay.classList.add('is-open');
  }

  modalOverlay.addEventListener('click', function (e) {
    if (e.target === modalOverlay) closeModal();
  });

  /* ============================================================
     MOCK DATA — العمادات
  ============================================================= */
  const MOCK_DEANSHIPS = [
    { id: 1, name: 'عمادة كلية الهندسة وتكنولوجيا المعلومات', dean_name: 'د. أحمد العلي', code: 'ENG' },
    { id: 2, name: 'عمادة كلية العلوم', dean_name: 'د. سلمى خليل', code: 'SCI' },
    { id: 3, name: 'عمادة كلية الطب', dean_name: 'د. ياسر حمدان', code: 'MED' },
    { id: 4, name: 'عمادة كلية الأعمال والاقتصاد', dean_name: 'د. ريم صالح', code: 'BUS' },
    { id: 5, name: 'عمادة كلية الآداب', dean_name: 'د. مازن أبو دية', code: 'ART' }
  ];

  /* ============================================================
     MOCK DATA — التخصصات لكل عمادة (بيانات إضافية: درجة، مدة، ساعات)
  ============================================================= */
  const MOCK_MAJORS_BY_DEANSHIP = {
    1: [
      { id: 101, name: 'علوم الحاسوب', degree: 'بكالوريوس', duration_years: 4, hasPlan: true },
      { id: 102, name: 'هندسة البرمجيات', degree: 'بكالوريوس', duration_years: 4, hasPlan: true },
      { id: 103, name: 'هندسة الحاسوب', degree: 'بكالوريوس', duration_years: 4, hasPlan: false },
      { id: 104, name: 'الأمن السيبراني', degree: 'بكالوريوس', duration_years: 4, hasPlan: true },
      { id: 105, name: 'الذكاء الاصطناعي', degree: 'بكالوريوس', duration_years: 4, hasPlan: true }
    ],
    2: [
      { id: 201, name: 'الفيزياء', degree: 'بكالوريوس', duration_years: 4, hasPlan: true },
      { id: 202, name: 'الكيمياء', degree: 'بكالوريوس', duration_years: 4, hasPlan: true },
      { id: 203, name: 'الرياضيات', degree: 'بكالوريوس', duration_years: 4, hasPlan: false },
      { id: 204, name: 'الأحياء', degree: 'بكالوريوس', duration_years: 4, hasPlan: true }
    ],
    3: [
      { id: 301, name: 'الطب البشري', degree: 'بكالوريوس', duration_years: 6, hasPlan: true },
      { id: 302, name: 'طب الأسنان', degree: 'بكالوريوس', duration_years: 5, hasPlan: true },
      { id: 303, name: 'الصيدلة', degree: 'بكالوريوس', duration_years: 5, hasPlan: true },
      { id: 304, name: 'التمريض', degree: 'بكالوريوس', duration_years: 4, hasPlan: false }
    ],
    4: [
      { id: 401, name: 'إدارة الأعمال', degree: 'بكالوريوس', duration_years: 4, hasPlan: true },
      { id: 402, name: 'المحاسبة', degree: 'بكالوريوس', duration_years: 4, hasPlan: true },
      { id: 403, name: 'الاقتصاد', degree: 'بكالوريوس', duration_years: 4, hasPlan: false },
      { id: 404, name: 'التسويق', degree: 'بكالوريوس', duration_years: 4, hasPlan: true }
    ],
    5: [
      { id: 501, name: 'اللغة العربية', degree: 'بكالوريوس', duration_years: 4, hasPlan: true },
      { id: 502, name: 'اللغة الإنجليزية', degree: 'بكالوريوس', duration_years: 4, hasPlan: true },
      { id: 503, name: 'تأهيل ذوي الإعاقة', degree: 'بكالوريوس', duration_years: 4, hasPlan: false },
      { id: 504, name: 'علم النفس', degree: 'بكالوريوس', duration_years: 4, hasPlan: true }
    ]
  };

  const COURSE_TOPICS = [
    'مبادئ', 'أساسيات', 'مقدمة في', 'نظريات', 'تطبيقات', 'مهارات', 'ورشة عمل في',
    'إدارة', 'تحليل', 'تصميم', 'مشروع في', 'قضايا معاصرة في'
  ];

  const GENERIC_SUPPORT_COURSES = [
    'اللغة الإنجليزية', 'مهارات الحاسوب', 'التربية الوطنية', 'مهارات الاتصال', 'الإحصاء العام'
  ];

  // مهارات مستهدفة عامة — نفس المهارات يلي بيقترحها الـ AI بصفحة إضافة تخصص،
  // بتنعرض هون كنتيجة نهائية بعد ما تُراجع وتُعتمد من الإدارة
  const TARGET_SKILLS_POOL = [
    'التفكير التحليلي', 'حل المشكلات', 'العمل ضمن فريق',
    'إدارة الوقت', 'التواصل الفعّال', 'التفكير النقدي',
    'إدارة المشاريع', 'مهارات البحث العلمي'
  ];

  /* ============================================================
     STATE
  ============================================================= */
  let currentDeanship = null;
  let currentMajor = null;

  /* ============================================================
     TRAIL (Breadcrumb)
  ============================================================= */
  function renderTrail() {
    const trail = document.getElementById('browseTrail');
    trail.innerHTML = '';

    const rootBtn = document.createElement(currentDeanship ? 'button' : 'span');
    rootBtn.textContent = 'العمادات';
    if (currentDeanship) {
      rootBtn.addEventListener('click', () => goToStep(1));
    } else {
      rootBtn.className = 'trail-current';
    }
    trail.appendChild(rootBtn);

    if (currentDeanship) {
      trail.insertAdjacentHTML('beforeend', arrowSvg());
      const deanBtn = document.createElement(currentMajor ? 'button' : 'span');
      deanBtn.textContent = currentDeanship.name;
      if (currentMajor) {
        deanBtn.addEventListener('click', () => goToStep(2));
      } else {
        deanBtn.className = 'trail-current';
      }
      trail.appendChild(deanBtn);
    }

    if (currentMajor) {
      trail.insertAdjacentHTML('beforeend', arrowSvg());
      const majorSpan = document.createElement('span');
      majorSpan.className = 'trail-current';
      majorSpan.textContent = currentMajor.name;
      trail.appendChild(majorSpan);
    }
  }

  function arrowSvg() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 18l-6-6 6-6"/></svg>';
  }

  /* ============================================================
     STEP NAVIGATION
  ============================================================= */
  const stepSections = {
    1: document.getElementById('stepDeanships'),
    2: document.getElementById('stepMajors'),
    3: document.getElementById('stepPlan')
  };
  const stepButtons = {
    1: document.getElementById('stepBtn1'),
    2: document.getElementById('stepBtn2'),
    3: document.getElementById('stepBtn3')
  };

  function goToStep(step) {
    if (step >= 2 && !currentDeanship) return;
    if (step >= 3 && !currentMajor) return;

    Object.keys(stepSections).forEach(k => {
      stepSections[k].classList.toggle('active', Number(k) === step);
      stepButtons[k].classList.toggle('active', Number(k) === step);
    });

    if (step === 1) { currentMajor = null; }
    if (step === 2) { currentMajor = null; }

    renderTrail();
  }

  stepButtons[1].addEventListener('click', () => goToStep(1));
  stepButtons[2].addEventListener('click', () => goToStep(2));
  stepButtons[3].addEventListener('click', () => { if (currentMajor) goToStep(3); });

  /* ============================================================
     STEP 1 — RENDER DEANSHIPS
  ============================================================= */
  const deanshipGrid = document.getElementById('deanshipGrid');

  function initials(name) {
    // ياخد أول حرفين من اسم العمادة بعد إزالة كلمة "عمادة"
    const clean = name.replace('عمادة', '').trim();
    return clean.slice(0, 2);
  }

  function renderDeanships(filter) {
    deanshipGrid.innerHTML = '';

    const list = MOCK_DEANSHIPS.filter(d =>
      !filter || d.name.includes(filter) || d.dean_name.includes(filter)
    );

    if (!list.length) {
      deanshipGrid.innerHTML = '<p style="color:#6b6f80;font-size:13.5px;">ما في نتائج مطابقة لبحثك.</p>';
      return;
    }

    list.forEach(d => {
      const majorsCount = (MOCK_MAJORS_BY_DEANSHIP[d.id] || []).length;
      const colorClass = 'c' + (((d.id - 1) % 5) + 1); // يدوّر بين 5 تدرجات لونية معرّفة بالـ CSS

      const card = document.createElement('div');
      card.className = 'deanship-card';
      card.innerHTML = `
        <div class="deanship-card-top">
          <div class="deanship-logo ${colorClass}">${initials(d.name)}</div>
          <div>
            <h4>${d.name}</h4>
            <div class="dean-name">${d.dean_name}</div>
          </div>
        </div>
        <div class="deanship-card-footer">
          <span class="majors-count-badge">${majorsCount} تخصص</span>
          <span class="deanship-card-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 18l-6-6 6-6"/></svg>
          </span>
        </div>
      `;
      card.addEventListener('click', () => selectDeanship(d));
      deanshipGrid.appendChild(card);
    });
  }

  document.getElementById('deanshipSearchInput').addEventListener('input', function () {
    renderDeanships(this.value.trim());
  });

  function selectDeanship(deanship) {
    currentDeanship = deanship;
    currentMajor = null;
    document.getElementById('majorsPanelTitle').textContent = `تخصصات ${deanship.name}`;
    renderMajors();
    goToStep(2);
  }

  /* ============================================================
     STEP 2 — RENDER MAJORS
  ============================================================= */
  const majorGrid = document.getElementById('majorGrid');

  function renderMajors() {
    majorGrid.innerHTML = '';

    const majors = MOCK_MAJORS_BY_DEANSHIP[currentDeanship.id] || [];

    if (!majors.length) {
      majorGrid.innerHTML = '<p style="color:#6b6f80;font-size:13.5px;">ما في تخصصات مضافة تحت هاي العمادة بعد.</p>';
      return;
    }

    majors.forEach(m => {
      const card = document.createElement('div');
      card.className = 'major-card';
      card.innerHTML = `
        <div class="major-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z"/><path d="M6 12v5c0 1.5 2.5 3 6 3s6-1.5 6-3v-5"/></svg>
        </div>
        <h5>${m.name}</h5>
        <div class="major-meta">
          <span>${m.degree}</span>
          <span class="dot">•</span>
          <span>${m.duration_years} سنوات</span>
        </div>
      `;
      card.addEventListener('click', () => selectMajor(m));
      majorGrid.appendChild(card);
    });
  }

  function selectMajor(major) {
    currentMajor = major;
    renderPlan();
    goToStep(3);
  }

  /* ============================================================
     STEP 3 — RENDER STUDY PLAN (بيانات وهمية مبنية على التخصص)
  ============================================================= */
  const planStatsEl = document.getElementById('planStats');
  const planGoalsEl = document.getElementById('planGoals');
  const planSkillsBlockEl = document.getElementById('planSkillsBlock');
  const planSkillsChipsEl = document.getElementById('planSkillsChips');
  const planSemestersEl = document.getElementById('planSemesters');

  // توليد خطة دراسية وهمية ثابتة حسب رقم التخصص (نفس النتيجة كل مرة)
  function seededRandom(seed) {
    let x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
  }

  function generateMockPlan(major) {
    const totalSemesters = major.duration_years * 2;
    const coursesPerSemester = 5;
    let totalCourses = 0;
    let totalCreditHours = 0;

    const semesters = [];

    for (let s = 1; s <= totalSemesters; s++) {
      const courses = [];

      for (let c = 1; c <= coursesPerSemester; c++) {
        const seed = major.id * 100 + s * 10 + c;
        const isSupport = c === 1 && s <= 2;
        const topic = COURSE_TOPICS[Math.floor(seededRandom(seed) * COURSE_TOPICS.length)];
        const credit = 3;

        const name = isSupport
          ? GENERIC_SUPPORT_COURSES[(s + c) % GENERIC_SUPPORT_COURSES.length]
          : `${topic} ${major.name}`;

        courses.push({ name, credit_hours: credit, code: `${101 + major.id}${s}${c}` });
        totalCourses++;
        totalCreditHours += credit;
      }

      semesters.push({ number: s, courses });
    }

    return { semesters, totalCourses, totalCreditHours };
  }

  function renderPlan() {
    const major = currentMajor;
    const deanship = currentDeanship;

    document.getElementById('planMajorName').textContent = major.name;
    document.getElementById('planMajorSub').textContent =
      `${deanship.name} • ${major.degree} • مدة الدراسة ${major.duration_years} سنوات`;

    // إذا التخصص ما إله خطة مرفوعة بعد
    planSemestersEl.innerHTML = '';
    planSkillsBlockEl.hidden = true;
    if (!major.hasPlan) {
      planStatsEl.innerHTML = '';
      planGoalsEl.style.display = 'none';
      planSemestersEl.innerHTML = `
        <div class="empty-plan-hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="10"/></svg>
          ما تم رفع خطة دراسية لهذا التخصص بعد. ارفعيها من صفحة "تحديث الخطط الدراسية".
        </div>
      `;
      return;
    }

    planGoalsEl.style.display = 'block';

    const plan = generateMockPlan(major);

    // مهارات مستهدفة ثابتة لكل تخصص (بنفس منطق seededRandom عشان تضل ثابتة كل مرة)
    const skillsCount = 4;
    const majorSkills = [];
    for (let i = 0; i < skillsCount; i++) {
      const idx = Math.floor(seededRandom(major.id * 7 + i) * TARGET_SKILLS_POOL.length);
      const skill = TARGET_SKILLS_POOL[idx];
      if (!majorSkills.includes(skill)) majorSkills.push(skill);
    }

    if (majorSkills.length) {
      planSkillsBlockEl.hidden = false;
      planSkillsChipsEl.innerHTML = majorSkills.map(s => `
        <span class="plan-skill-chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6L9 17l-5-5"/></svg>
          ${s}
        </span>
      `).join('');
    }

    planStatsEl.innerHTML = `
      <div class="plan-stat"><strong>${major.duration_years}</strong><span>سنوات الدراسة</span></div>
      <div class="plan-stat"><strong>${plan.semesters.length}</strong><span>عدد الفصول</span></div>
      <div class="plan-stat"><strong>${plan.totalCourses}</strong><span>عدد المواد</span></div>
      <div class="plan-stat"><strong>${plan.totalCreditHours}</strong><span>الساعات المعتمدة</span></div>
    `;

    planGoalsEl.innerHTML = `
      <strong>نبذة عن التخصص</strong>
      يهدف تخصص ${major.name} في ${deanship.name} إلى إعداد خريجين مؤهلين علمياً وعملياً،
      قادرين على المنافسة بسوق العمل المحلي والإقليمي، من خلال خطة دراسية متوازنة بين
      المواد التخصصية والمهارات العملية على مدار ${major.duration_years} سنوات دراسية.
    `;

    plan.semesters.forEach(sem => {
      const block = document.createElement('div');
      block.className = 'semester-block';
      block.innerHTML = `
        <h3><span class="sem-num">${sem.number}</span> الفصل الدراسي ${sem.number}</h3>
        <table class="semester-table">
          <thead>
            <tr>
              <th>رمز المادة</th>
              <th>اسم المادة</th>
              <th>الساعات المعتمدة</th>
            </tr>
          </thead>
          <tbody>
            ${sem.courses.map(c => `
              <tr>
                <td>${c.code}</td>
                <td>${c.name}</td>
                <td>${c.credit_hours}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      planSemestersEl.appendChild(block);
    });
  }

  document.getElementById('editMajorBtn').addEventListener('click', function () {
    window.location.href = `add-program.html?edit=${currentMajor.id}`;
  });

  document.getElementById('updatePlanBtn').addEventListener('click', function () {
    window.location.href = `programs.html?deanship=${currentDeanship.id}&major=${currentMajor.id}`;
  });

  document.getElementById('planDownloadBtn').addEventListener('click', function () {
    if (USE_MOCK_DATA) {
      openModal({
        type: 'info',
        title: 'عرض الملف الأصلي',
        message: 'هاي محاكاة محلية بدون باك اند — بالنسخة الحقيقية رح يفتح ملف PDF/Excel اللي رفعته الإدارة لهذا التخصص.'
      });
      return;
    }

    // TODO: ربط الباك اند الحقيقي هنا
    // window.open(`${API_BASE_URL}/majors/${currentMajor.id}/plan-file`, '_blank');
  });

  /* ============================================================
     INIT
  ============================================================= */
  renderDeanships('');
  renderTrail();

})();
</script>
