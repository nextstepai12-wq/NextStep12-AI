<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>المحتوى الأكاديمي — الإعدادات | NextStep AI</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Shared CSS -->
  <link rel="stylesheet" href="../../css/app.css">
  <link rel="stylesheet" href="../../css/dashboardcss/admin-shell.css">
  <link rel="stylesheet" href="../../css/dashboardcss/settings-dashboard.css">

  <style>

    /* =========================================================
       PAGE
    ========================================================= */

    .academic-settings-wrapper {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }


    /* =========================================================
       SIDE STEPPER
    ========================================================= */

    .academic-stepper {
      background: var(--white);
      border: 1px solid rgba(47,107,255,.06);
      border-radius: var(--radius);
      padding: 20px 16px;
      box-shadow: var(--shadow);
      position: sticky;
      top: 90px;
    }

    .academic-stepper-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--navy);
      margin: 0 0 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--gray-bg);
    }

    .academic-stepper-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .academic-step {
      width: 100%;
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 10px;
      border-radius: 12px;
      cursor: pointer;
      text-align: right;
      font-family: 'Cairo', sans-serif;
      transition: .2s ease;
    }

    .academic-step:hover {
      background: var(--gray-bg);
    }

    .academic-step.active {
      background: rgba(47,107,255,.07);
    }

    .academic-step-number {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 50%;
      border: 2px solid var(--gray-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--gray);
      transition: .2s ease;
    }

    .academic-step.active .academic-step-number {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .academic-step-text strong {
      display: block;
      color: var(--navy);
      font-size: 13px;
      font-weight: 700;
    }

    .academic-step.active .academic-step-text strong {
      color: var(--blue);
    }

    .academic-step-text span {
      display: block;
      margin-top: 2px;
      color: var(--gray);
      font-size: 11px;
      line-height: 1.5;
    }


    /* =========================================================
       MAIN PANEL
    ========================================================= */

    .academic-panel {
      display: none;
      background: var(--white);
      border-radius: var(--radius);
      padding: 24px;
      border: 1px solid rgba(47,107,255,.05);
      box-shadow: var(--shadow);
      animation: academicFade .22s ease;
    }

    .academic-panel.active {
      display: block;
    }

    @keyframes academicFade {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    /* =========================================================
       PANEL HEADER
    ========================================================= */

    .academic-panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--gray-bg);
    }

    .academic-panel-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      color: var(--navy);
    }

    .academic-panel-desc {
      margin: 5px 0 0;
      color: var(--gray);
      font-size: 12px;
      line-height: 1.8;
    }


    /* =========================================================
       STATS
    ========================================================= */

    .academic-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .academic-stat {
      border: 1px solid var(--gray-bg);
      border-radius: 12px;
      padding: 14px;
      background: #fcfdff;
    }

    .academic-stat strong {
      display: block;
      color: var(--blue);
      font-size: 20px;
      font-weight: 800;
    }

    .academic-stat span {
      display: block;
      margin-top: 3px;
      color: var(--gray);
      font-size: 11px;
    }


    /* =========================================================
       LIST ROWS (كليات / عمادات)
    ========================================================= */

    .academic-list {
      border: 1px solid var(--gray-bg);
      border-radius: 14px;
      overflow: hidden;
    }

    .academic-list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 14px 16px;
      border-bottom: 1px solid var(--gray-bg);
    }

    .academic-list-row:last-child {
      border-bottom: none;
    }

    .academic-list-row:hover {
      background: #fbfcff;
    }

    .academic-list-row-info strong {
      display: block;
      color: var(--navy);
      font-size: 13px;
      font-weight: 700;
    }

    .academic-list-row-info .academic-list-row-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      color: var(--gray);
      font-size: 11px;
    }

    .academic-list-empty {
      padding: 20px 16px;
      color: var(--gray);
      font-size: 11.5px;
      text-align: center;
    }


    /* =========================================================
       SUBSECTION HEAD
    ========================================================= */

    .academic-subsection-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin: 0 0 12px;
    }

    .academic-subsection-head h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      color: var(--navy);
    }


    /* =========================================================
       BADGES
    ========================================================= */

    .academic-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
    }

    .academic-badge.success {
      background: rgba(14,174,123,.10);
      color: #0EAE7B;
    }

    .academic-badge.warning {
      background: rgba(245,158,11,.10);
      color: #b56d00;
    }

    .academic-badge.blue {
      background: rgba(47,107,255,.08);
      color: var(--blue);
    }


    /* =========================================================
       ACTIONS
    ========================================================= */

    .academic-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
      flex-wrap: wrap;
    }

    .academic-action {
      border: 0;
      background: transparent;
      color: var(--blue);
      font-family: 'Cairo', sans-serif;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      padding: 5px 7px;
      border-radius: 7px;
    }

    .academic-action:hover {
      background: rgba(47,107,255,.07);
    }

    .academic-action.danger {
      color: var(--red);
    }


    /* =========================================================
       ADD BUTTON
    ========================================================= */

    .academic-add-btn {
      border: 0;
      background: var(--blue);
      color: #fff;
      padding: 9px 15px;
      border-radius: 9px;
      font-family: 'Cairo', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .academic-add-btn:hover {
      opacity: .92;
    }

    .academic-add-btn.outline {
      background: transparent;
      color: var(--blue);
      border: 1.5px solid rgba(47,107,255,.3);
    }


    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 1100px) {
      .academic-settings-wrapper {
        grid-template-columns: 1fr;
      }

      .academic-stepper {
        position: relative;
        top: 0;
      }

      .academic-stepper-list {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .academic-step {
        flex: 1;
        min-width: 190px;
      }
    }

    @media (max-width: 750px) {
      .academic-panel {
        padding: 17px;
      }

      .academic-stats {
        grid-template-columns: 1fr;
      }

      .academic-panel-head {
        flex-direction: column;
      }

      .academic-subsection-head {
        flex-direction: column;
        align-items: flex-start;
      }
    }

  </style>
</head>

<body>

<header class="admin-topbar" id="adminTopbar"></header>

<div class="admin-layout">

  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <main class="admin-main admin-main-content">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <div class="admin-page-head">
      <div>
        <h1>المحتوى الأكاديمي</h1>

        <p>
          إدارة الكليات والعمادات الخاصة بالجامعة.
        </p>
      </div>
    </div>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <div class="academic-settings-wrapper">


      <!-- ===================================================
           STEPPER
      ==================================================== -->

      <aside class="academic-stepper">

        <h3 class="academic-stepper-title">
          أقسام المحتوى الأكاديمي
        </h3>

        <ul class="academic-stepper-list">

          <li>
            <button
              type="button"
              class="academic-step active"
              data-target="panelColleges"
            >
              <span class="academic-step-number">1</span>

              <span class="academic-step-text">
                <strong>الكليات</strong>
                <span>إدارة الكليات في الجامعة</span>
              </span>
            </button>
          </li>


          <li>
            <button
              type="button"
              class="academic-step"
              data-target="panelDeanships"
            >
              <span class="academic-step-number">2</span>

              <span class="academic-step-text">
                <strong>العمادات</strong>
                <span>إدارة العمادات في الجامعة</span>
              </span>
            </button>
          </li>

        </ul>

      </aside>


      <!-- ===================================================
           PANELS
      ==================================================== -->

      <div>


        <!-- =================================================
             1 — COLLEGES
        ================================================== -->

        <section
          class="academic-panel active"
          id="panelColleges"
        >

          <div class="academic-panel-head">

            <div>
              <h2 class="academic-panel-title">
                الكليات
              </h2>

              <p class="academic-panel-desc">
                إدارة الكليات المرتبطة بالجامعة.
              </p>
            </div>

            <button
              type="button"
              class="academic-add-btn"
              onclick="window.location.href='addcollege.html'"
            >
              + إضافة كلية
            </button>

          </div>


          <!-- ===== إحصائيات ===== -->
          <div class="academic-stats">

            <div class="academic-stat">
              <strong id="collegeCount">—</strong>
              <span>كلية مسجلة</span>
            </div>

            <div class="academic-stat">
              <strong id="collegeDeanshipsCount">—</strong>
              <span>عمادة تابعة</span>
            </div>

          </div>


          <div class="academic-subsection-head">
            <h3>قائمة الكليات</h3>
          </div>

          <div class="academic-list" id="collegesList"></div>

        </section>


        <!-- =================================================
             2 — DEANSHIPS
        ================================================== -->

        <section
          class="academic-panel"
          id="panelDeanships"
        >

          <div class="academic-panel-head">

            <div>
              <h2 class="academic-panel-title">
                العمادات
              </h2>

              <p class="academic-panel-desc">
                إدارة العمادات المرتبطة بالجامعة.
              </p>
            </div>

            <button
              type="button"
              class="academic-add-btn"
              onclick="window.location.href='adddeanship.html'"
            >
              + إضافة عمادة
            </button>

          </div>


          <!-- ===== إحصائيات ===== -->
          <div class="academic-stats">

            <div class="academic-stat">
              <strong id="deanshipCount">—</strong>
              <span>عمادة مسجلة</span>
            </div>

            <div class="academic-stat">
              <strong id="majorCountA">—</strong>
              <span>تخصصاً</span>
            </div>

          </div>


          <div class="academic-subsection-head">
            <h3>قائمة العمادات</h3>
          </div>

          <div class="academic-list" id="deanshipsList"></div>

        </section>


      </div>

    </div>

  </main>

</div>


<!-- =========================================================
     FOOTER
========================================================= -->

<div id="admin-footer-slot"></div>


<!-- =========================================================
     ADMIN SHELL
========================================================= -->

<script src="../../js/admin-shell.js"></script>


<script>

(function () {

  'use strict';


  /* =========================================================
     STEPPER
  ========================================================= */

  const steps =
    document.querySelectorAll('.academic-step');

  const panels =
    document.querySelectorAll('.academic-panel');


  function showPanel(targetId) {

    panels.forEach(function (panel) {

      panel.classList.toggle(
        'active',
        panel.id === targetId
      );

    });


    steps.forEach(function (step) {

      step.classList.toggle(
        'active',
        step.dataset.target === targetId
      );

    });

  }


  steps.forEach(function (step) {

    step.addEventListener(
      'click',
      function () {

        showPanel(
          step.dataset.target
        );

      }
    );

  });


  /* =========================================================
     MOCK DATA — الكليات
  ========================================================= */

  const COLLEGES = [

    { id: 1, name: 'كلية الهندسة وتكنولوجيا المعلومات' },
    { id: 2, name: 'كلية العلوم' },
    { id: 3, name: 'كلية إدارة الأعمال والاقتصاد' }

  ];


  /* =========================================================
     MOCK DATA — العمادات
     college_id تربط العمادة بالكلية (تُستخدم فقط لعرض
     اسم الكلية التابعة لها العمادة داخل قائمة العمادات).
  ========================================================= */

  const DEANSHIPS = [

    {
      id: 1,
      name: 'عمادة كلية الهندسة وتكنولوجيا المعلومات',
      college_id: 1,
      majors: 5,
      status: 'مكتمل'
    },

    {
      id: 2,
      name: 'عمادة كلية العلوم',
      college_id: 2,
      majors: 4,
      status: 'مكتمل'
    },

    {
      id: 3,
      name: 'عمادة كلية إدارة الأعمال والاقتصاد',
      college_id: 3,
      majors: 4,
      status: 'يحتاج مراجعة'
    }

  ];


  function collegeNameById(id) {

    const college = COLLEGES.find(function (c) {
      return c.id === id;
    });

    return college ? college.name : '—';

  }


  /* =========================================================
     العناصر
  ========================================================= */

  const collegesList = document.getElementById('collegesList');
  const deanshipsList = document.getElementById('deanshipsList');

  const collegeCountEl = document.getElementById('collegeCount');
  const collegeDeanshipsCountEl = document.getElementById('collegeDeanshipsCount');
  const deanshipCountEl = document.getElementById('deanshipCount');
  const majorCountAEl = document.getElementById('majorCountA');


  /* =========================================================
     عرض قائمة الكليات
  ========================================================= */

  function renderColleges() {

    if (!COLLEGES.length) {

      collegesList.innerHTML =
        '<div class="academic-list-empty">ما في كليات مضافة بعد.</div>';

      return;

    }

    collegesList.innerHTML = COLLEGES.map(function (college) {

      const relatedDeanshipsCount = DEANSHIPS.filter(function (d) {
        return d.college_id === college.id;
      }).length;

      return `

        <div class="academic-list-row">

          <div class="academic-list-row-info">

            <strong>${college.name}</strong>

            <div class="academic-list-row-meta">
              <span class="academic-badge blue">${relatedDeanshipsCount} عمادة</span>
            </div>

          </div>

          <div class="academic-actions">

            <button
              type="button"
              class="academic-action"
              onclick="editCollege(${college.id})"
            >
              تعديل
            </button>

          </div>

        </div>

      `;

    }).join('');

  }


  /* =========================================================
     عرض قائمة العمادات
  ========================================================= */

  function renderDeanships() {

    if (!DEANSHIPS.length) {

      deanshipsList.innerHTML =
        '<div class="academic-list-empty">ما في عمادات مضافة بعد.</div>';

      return;

    }

    deanshipsList.innerHTML = DEANSHIPS.map(function (item) {

      const statusClass =
        item.status === 'مكتمل'
          ? 'success'
          : 'warning';

      return `

        <div class="academic-list-row">

          <div class="academic-list-row-info">

            <strong>${item.name}</strong>

            <div class="academic-list-row-meta">
              <span>${collegeNameById(item.college_id)}</span>
              <span>${item.majors} تخصص</span>
              <span class="academic-badge ${statusClass}">${item.status}</span>
            </div>

          </div>

          <div class="academic-actions">

            <button
              type="button"
              class="academic-action"
              onclick="window.location.href='browse-deanships.html'"
            >
              عرض
            </button>

            <button
              type="button"
              class="academic-action"
              onclick="window.location.href='adddeanship.html'"
            >
              تعديل
            </button>

          </div>

        </div>

      `;

    }).join('');

  }


  /* =========================================================
     تهيئة الإحصائيات + القوائم
  ========================================================= */

  function init() {

    collegeCountEl.textContent = COLLEGES.length;
    collegeDeanshipsCountEl.textContent = DEANSHIPS.length;

    deanshipCountEl.textContent = DEANSHIPS.length;

    majorCountAEl.textContent = DEANSHIPS.reduce(function (sum, d) {
      return sum + d.majors;
    }, 0);

    renderColleges();
    renderDeanships();

  }


  init();


  /* =========================================================
     ACTIONS
  ========================================================= */

  window.editCollege = function () {

    /*
      TODO: تمرير معرّف الكلية بالرابط لما تكون صفحة
      addcollege.html جاهزة لوضع التعديل، مثلاً:
      addcollege.html?edit=<collegeId>
    */

    window.location.href =
      'addcollege.html';

  };


})();

</script>

</body>
</html>
