<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نسيت كلمة المرور — NextStep AI</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link href="../css/app.css" rel="stylesheet">
  <link href="../css/header.css" rel="stylesheet">
  <link href="../css/footer.css" rel="stylesheet">
  <link href="../css/auth.css" rel="stylesheet">
</head>
<body>

<!-- ======================= HEADER ======================= -->
<script src="header.js?v=2"></script>


<!-- ======================= AUTH CARD ======================= -->
<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-logo">
      <img src="../assets/logo.png" alt="NextStep AI" class="brand-logo">
      <div class="brand-text">NextStep <span>AI</span></div>
    </div>

    <div class="auth-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      استعادة الوصول
    </div>

    <h1 class="auth-title">نسيتِ كلمة المرور؟</h1>
<p class="auth-subtitle">أدخل بريدك الإلكتروني المسجّل وسنرسل لك كوداً لإعادة تعيين كلمة المرور</p>
    <form id="forgotForm">

      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <div class="input-icon-wrap">
          <input type="email" class="form-control" id="email" name="email" placeholder="example@email.com" required>
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        إرسال الكود
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </button>
    </form>

    <p class="auth-footer-text">تذكرت كلمة المرور؟ <a href="login.html">تسجيل الدخول</a></p>
  </div>
</div>

<script>
  const API_BASE_URL = 'http://127.0.0.1:8000/api';

  const forgotForm = document.getElementById('forgotForm');
  const submitBtn = forgotForm.querySelector('.btn-submit');
  const emailInput = document.getElementById('email');

  const alertBox = document.createElement('div');
  alertBox.id = 'forgotAlert';
  alertBox.style.cssText = 'display:none;margin-bottom:16px;padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;';
  forgotForm.prepend(alertBox);

  function showAlert(message, type) {
    alertBox.textContent = message;
    alertBox.style.display = 'block';
    if (type === 'error') {
      alertBox.style.background = '#FDEDEE';
      alertBox.style.color = '#C62828';
    } else {
      alertBox.style.background = 'rgba(72,230,176,0.12)';
      alertBox.style.color = '#1C8F63';
    }
  }

  forgotForm.addEventListener('submit', async function (e) {
    e.preventDefault();

    const email = emailInput.value;

    submitBtn.disabled = true;
    submitBtn.textContent = 'جارٍ الإرسال...';
    alertBox.style.display = 'none';

    try {
      const response = await fetch(`${API_BASE_URL}/forgot-password`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json',
        },
        body: JSON.stringify({ email }),
      });

      const data = await response.json();

     if (response.ok && data.status === 'success') {
  window.location.href = `verify-code.html?email=${encodeURIComponent(email)}`;
}else {
const errorMsg = data.message || 'تعذر إرسال الكود، تأكدي إنه الإيميل مسجّل وحاولي مرة ثانية';        showAlert(errorMsg, 'error');
        submitBtn.disabled = false;
      }
    } catch (err) {
      showAlert('تعذر الاتصال بالسيرفر. تأكدي إنه الباك اند شغال.', 'error');
      console.error('Forgot password error:', err);
      submitBtn.disabled = false;
    } finally {
      submitBtn.innerHTML = 'إرسال الكود  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>';
    }
  });
</script>

<!-- ======================= FOOTER ======================= -->
<script src="footer.js"></script>

</body>
</html>
