<link rel="stylesheet" href="../css/signup.css">

</head>
<body>

<!-- ======================= HEADER (يتحمّل تلقائياً من header.html) ======================= -->

  <div class="nav-inner">
    <a href="index.html" class="brand-mark">
      <img src="assets/logo.png" alt="NextStep AI" class="brand-logo">
      <div class="brand-text">NextStep<span>AI</span> </div>

    <nav class="main-nav">
      <ul>
<li><a href="fronted/about.html">عن المنصة</a></li>

      </ul>

    <div class="nav-actions">
     
      <a href="fronted/login.html" class="btn-signin">تسجيل دخول</a>
    </div>
  </div>
</header>


<!-- ======================= AUTH CARD ======================= -->
<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-logo">
    img
      <div class="brand-text">NextStep <span>AI</span></div>
    </div>
c
    <h1 class="auth-title">أهلاً بعودتك</h1>
    <p class="auth-subtitle">سجّل دخولك للمتابعة إلى حسابك</p>

  <form id="loginForm">
  <div class="form-group">
    <label for="email">البريد الإلكتروني</label>
    <input type="email" class="form-control" id="email" name="email" placeholder="أدخل بريدك الإلكتروني">
  </div>

  <div class="form-group">
    <label for="password">كلمة المرور</label>
    <input type="password" class="form-control" id="password" name="password" placeholder="أدخل كلمة المرور">
  </div>

  <div class="form-meta">
   <a href="./forgot-password.html">نسيت كلمة المرور؟</a>
  </div>

  <button type="submit" class="btn-submit">
    تسجيل الدخول
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
  </button>
</form>

    <p class="auth-footer-text">ليس لديك حساب؟ <a href="student-signup.html">أنشئ واحداً</a></p>
  </div>
</div>

<!-- ======================= FOOTER (يتحمّل تلقائياً من footer.html) ======================= -->
<div id="footer-placeholder"></div>
<script>
  const loginForm = document.getElementById('loginForm');

  if (loginForm) {
    loginForm.addEventListener('submit', function (e) {
      e.preventDefault();

      const emailVal = document.getElementById('email').value;
      const passwordVal = document.getElementById('password').value;

      fetch('http://127.0.0.1:8000/api/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({
          email: emailVal,
          password: passwordVal
        })
      })
      .then(async (response) => {
        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.message || 'بيانات الدخول غير صحيحة');
        }

        return result;
      })
      .then((res) => {
        // فحص الرد وتغطية الحالتين (سواء الـ Token داخل data أم مباشرة)
        const token = res.data?.token || res.token;
        const user = res.data?.user || res.user;

        // ✅ مفتاح موحّد "token" بكل الصفحات (كان اسمه auth_token بصفحة التسجيل قبل، تم توحيده)
        if (token) {
          localStorage.setItem('token', token);
          if (user) {
            localStorage.setItem('user', JSON.stringify(user));
          }
        }

        alert('تم تسجيل الدخول بنجاح!');

        // التوجيه لصفحة الاختبار
       window.location.href = 'quiz.html';
      })
      .catch((error) => {
        console.error('Login Error:', error);
        alert(error.message);
      });
    });
  }
</script>
</body>
</html>
