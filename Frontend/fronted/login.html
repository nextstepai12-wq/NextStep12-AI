<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - NextStep AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/header.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/footer.css">
</head>

<body>

<!-- ======================= HEADER ======================= -->
<script src="../js/header-index.js"></script>

<!-- =========================================================
     BACKGROUND
========================================================= -->
<div class="auth-background">
    <div class="background-grid"></div>
</div>

<!-- =========================================================
     MAIN AUTH SHELL
========================================================= -->
<main class="auth-shell">

    <!-- =====================================================
         RIGHT (now first) — NEXTSTEP HERO
    ====================================================== -->
    <section class="auth-hero">

        <div class="hero-glow"></div>

        <!-- BRAND -->
        <div class="hero-brand">
            <span class="brand-name">NextStep <span class="brand-ai">AI</span></span>
            <img src="../assets/img/logo.png" alt="NextStep AI" class="brand-mini-logo-img">
        </div>

        <!-- HERO COPY -->
        <div class="hero-copy">
            <h2 class="hero-title">منصتك الذكية <span class="blue">لمستقبلك الأكاديمي</span></h2>
            <p class="hero-description">
                تابع من حيث توقفت — نتائج اختباراتك،
                توصياتك، وخطتك الدراسية كلها بانتظارك.
            </p>
        </div>

        <!-- ANIMATED NEXTSTEP LOGO (صورة كمجسم متحرك بمنظور 3D) -->
        <div class="logo-stage">
            <img src="../assets/img/logo.png" alt="NextStep AI" class="nextstep-logo-img">
        </div>

        <!-- FEATURES -->
        <div class="hero-features">
            <div class="feature">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <circle cx="12" cy="12" r="8"/>
                        <path d="M12 8v5l3 2"/>
                    </svg>
                </div>
                <span class="feature-title">مرشد ذكي دائم</span>
            </div>

            <div class="feature">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <rect x="5" y="4" width="14" height="16" rx="2"/>
                        <path d="M8 8h8"/><path d="M8 12h8"/><path d="M8 16h5"/>
                    </svg>
                </div>
                <span class="feature-title">خطة تطور مهاراتك</span>
            </div>

            <div class="feature">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <path d="M7 17L17 7"/><path d="M10 7h7v7"/>
                    </svg>
                </div>
                <span class="feature-title">توصيات محفوظة</span>
            </div>
        </div>

    </section>

    <!-- =====================================================
         LEFT (now second) — LOGIN FORM
    ====================================================== -->
    <section class="auth-form-side">

        <div class="login-content">

            <div class="welcome">
                <h1>مرحباً بعودتك <span class="wave">👋</span></h1>
                <p>سجّل دخولك وكمل رحلتك الأكاديمية.</p>
            </div>

            <form class="login-form" id="loginForm" action="#" method="POST">

                <!-- EMAIL -->
                <div class="form-group">
                    <label class="form-label" for="email">البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                                <rect x="3" y="5" width="18" height="14" rx="2"/>
                                <path d="M3 7l9 6 9-6"/>
                            </svg>
                        </span>
                        <input id="email" name="email" class="form-input" type="email" placeholder="example@email.com" autocomplete="email" required>
                    </div>
                </div>

                <!-- PASSWORD -->
                <div class="form-group">
                    <label class="form-label" for="password">كلمة المرور</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                                <rect x="5" y="10" width="14" height="10" rx="2"/>
                                <path d="M8 10V7a4 4 0 018 0v3"/>
                            </svg>
                        </span>
                        <input id="password" name="password" class="form-input" type="password" placeholder="••••••••••" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="إظهار كلمة المرور">
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/>
                                <circle cx="12" cy="12" r="2.5"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- FORGOT -->
                <div class="forgot-row">
                    <a href="forgot-password.html" class="forgot-link">نسيت كلمة المرور؟</a>
                </div>

                <!-- LOGIN -->
                <button type="submit" class="login-button">
                    <span>تسجيل الدخول <span aria-hidden="true">←</span></span>
                </button>

                <!-- DIVIDER -->
                <div class="divider"><span>أو</span></div>

                <!-- GOOGLE -->
                <button type="button" class="google-button" id="googleLogin">
                    <span class="google-icon">G</span>
                    <span>المتابعة باستخدام Google</span>
                </button>

                <!-- SIGNUP -->
                <p class="signup-text">
                    ما عندك حساب؟
                    <a href="signup.html">أنشئ حساب جديد</a>
                </p>

            </form>

        </div>

    </section>

</main>

<!-- =========================================================
     JAVASCRIPT
========================================================= -->
<script>

    /* =====================================================
       PASSWORD VISIBILITY
    ===================================================== */
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const eyeIcon = document.getElementById("eyeIcon");

    togglePassword.addEventListener("click", function () {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        togglePassword.setAttribute("aria-label", isPassword ? "إخفاء كلمة المرور" : "إظهار كلمة المرور");

        if (isPassword) {
            eyeIcon.innerHTML = `
                <path d="M3 3l18 18"/>
                <path d="M10.6 10.6a2 2 0 102.8 2.8"/>
                <path d="M9.9 5.2 C10.6 5.1 11.3 5 12 5 C18 5 21.5 12 21.5 12 C20.7 13.7 19.5 15.1 18 16.2"/>
                <path d="M6.1 6.2 C3.7 8 2.5 12 2.5 12 C3.4 13.7 4.7 15.2 6.3 16.4 C7.9 17.6 9.8 18.4 12 18.4 C13.2 18.4 14.3 18.2 15.3 17.8"/>
            `;
        } else {
            eyeIcon.innerHTML = `
                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6 -3.5 6-9.5 6 -9.5-6-9.5-6z"/>
                <circle cx="12" cy="12" r="2.5"/>
            `;
        }
    });

    /* =====================================================
       LOGIN SUBMIT — POST /api/login
    ===================================================== */
    const API_BASE_URL = 'http://127.0.0.1:8000/api';

    const loginForm = document.getElementById("loginForm");
    const submitBtn = loginForm.querySelector(".login-button");

    const alertBox = document.createElement('div');
    alertBox.id = 'loginAlert';
    alertBox.style.cssText = 'display:none;margin-bottom:16px;padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;text-align:center;';
    loginForm.prepend(alertBox);

    function showAlert(message, type) {
        alertBox.textContent = message;
        alertBox.style.display = 'block';
        if (type === 'error') {
            alertBox.style.background = '#FDEDEE';
            alertBox.style.color = '#C62828';
        } else {
            alertBox.style.background = 'rgba(72,230,176,0.12)';
            alertBox.style.color = '#1C8F63';
        }
    }

    loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const payload = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
        };

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>جارٍ تسجيل الدخول...</span>';
        alertBox.style.display = 'none';

        try {
            const response = await fetch(`${API_BASE_URL}/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                },
                body: JSON.stringify(payload),
            });

            const data = await response.json();

            if (response.ok && data.status === 'success') {
                localStorage.setItem('auth_token', data.data.token);
                showAlert('تم تسجيل الدخول بنجاح! جارٍ التحويل...', 'success');
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
            } else {
                const errorMsg = data.message || 'البريد الإلكتروني أو كلمة المرور غير صحيحة';
                showAlert(errorMsg, 'error');
            }
        } catch (err) {
            showAlert('تعذر الاتصال بالسيرفر. تأكدي إنه الباك اند شغال.', 'error');
            console.error('Login error:', err);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>تسجيل الدخول <span aria-hidden="true">←</span></span>';
        }
    });

    /* =====================================================
       GOOGLE BUTTON
    ===================================================== */
    document.getElementById("googleLogin").addEventListener("click", function () {
        console.log("Google Login");
    });

</script>

<!-- ======================= FOOTER ======================= -->
<div id="footer-placeholder"></div>
<script src="../js/footer-index.js"></script>

</body>
</html>
