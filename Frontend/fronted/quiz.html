<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاستبيان الذكي — NextStep AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="../css/app.css" rel="stylesheet">
<link href="../css/header.css" rel="stylesheet">
<link href="../css/quiz.css" rel="stylesheet">
<link href="../css/footer.css" rel="stylesheet">
</head>
<body>

<!-- ======================= HEADER ======================= -->
<script src="../js/header-index.js"></script>
<!-- ======================= QUIZ ======================= -->
<div class="quiz-wrap">
  <div class="quiz-inner">

    <div class="quiz-head">
      <span class="quiz-eyebrow-top">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.6.5 1 1.3 1 2.1V17h6v-1.4c0-.8.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
        استبيان اكتشاف الميول
      </span>
      <h1>الاستبيان الذكي</h1>
      <p>أجب عن الأسئلة التالية بصدق، وخلينا نساعدك تكتشف التخصص الأنسب لشخصيتك ومهاراتك</p>
    </div>

    <!-- Stepper -->
    <div class="quiz-stepper" id="stepper"></div>
    <div class="quiz-progress-label">السؤال <span id="progressCurrent">1</span> من <span id="progressTotal">6</span></div>

    <!-- Question card -->
    <div class="quiz-card" id="quizCard">
      <div id="questionView">
        <div class="quiz-q-eyebrow" id="qEyebrow">السؤال 1</div>
        <div class="quiz-question" id="qText"></div>
        <div class="quiz-options" id="qOptions"></div>

        <div class="quiz-nav">
          <button class="quiz-nav-btn" id="btnPrev" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M11 19l-7-7 7-7"/></svg>
            السؤال السابق
          </button>
          <button class="quiz-nav-btn primary" id="btnNext" type="button">
            السؤال التالي
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>

      <!-- Completion state -->
      <div class="quiz-done" id="doneView" style="display:none;">
        <div class="done-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <h2>خلصنا! 🎉</h2>
        <p>جاوبت على كل الأسئلة. راح نحلل إجاباتك ونطلعلك أنسب التخصصات المناسبة لك.</p>
        <a href="results.html" class="btn-primary" style="display:inline-flex;align-items:center;gap:8px;">
          شوف النتيجة
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </a>
      </div>
    </div>

    <!-- Finish button -->
    <div class="quiz-finish-wrap">
      <button class="quiz-finish-btn" id="btnFinish" type="button" disabled>
        إنهاء الاختبار
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>
      </button>
    </div>

  </div>
</div>

<!-- ======================= FOOTER ======================= -->
<script src="../js/footer-index.js"></script>
<script>
/* ======================= QUIZ DATA ======================= */
const questions = [
  {
    text: "شو أكتر نشاط بتحس فيه بالمتعة والحماس؟",
    options: ["حل مسائل رياضية أو منطقية معقدة", "الرسم أو التصميم أو الكتابة الإبداعية", "التحدث مع الناس ومساعدتهم", "تفكيك جهاز ومعرفة كيف بيشتغل"]
  },
  {
    text: "لو خيّروك تشتغل بمشروع جماعي، أي دور بتحب تاخده؟",
    options: ["قائد الفريق ومنظّم الخطة", "المسؤول عن الأفكار الإبداعية", "المسؤول عن التنفيذ والتفاصيل الدقيقة", "المسؤول عن البحث وجمع المعلومات"]
  },
  {
    text: "أي مادة دراسية كانت الأقرب لقلبك؟",
    options: ["الرياضيات والفيزياء", "الأحياء والكيمياء", "اللغة العربية أو الإنجليزية", "الحاسوب والتكنولوجيا"]
  },
  {
    text: "كيف بتحب تقضي وقت فراغك؟",
    options: ["قراءة كتب أو مقالات علمية", "مشاهدة أفلام أو تصميم محتوى", "التطوع أو العمل مع مجموعات", "بناء أو برمجة شي جديد"]
  },
  {
    text: "شو أكتر شي بيحفزك بالشغل المستقبلي؟",
    options: ["الاستقرار المادي والراتب الجيد", "الإبداع وحرية التعبير", "مساعدة الناس والتأثير الإيجابي", "الابتكار وتطوير حلول جديدة"]
  },
  {
    text: "لو واجهتك مشكلة صعبة، شو أول رد فعل إلك؟",
    options: ["أحلل المشكلة خطوة بخطوة بمنطق", "أفكر بحل غير تقليدي وخارج الصندوق", "أستشير حدا واسأل عن رأيه", "أبحث عن حلول مشابهة جربها غيري"]
  }
];

/* ======================= STATE ======================= */
let current = 0;
const answers = new Array(questions.length).fill(null);

/* ======================= DOM ======================= */
const stepperEl = document.getElementById('stepper');
const qEyebrow = document.getElementById('qEyebrow');
const qText = document.getElementById('qText');
const qOptions = document.getElementById('qOptions');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnFinish = document.getElementById('btnFinish');
const progressCurrent = document.getElementById('progressCurrent');
const progressTotal = document.getElementById('progressTotal');
const questionView = document.getElementById('questionView');
const doneView = document.getElementById('doneView');

progressTotal.textContent = questions.length;

/* Build stepper dots + connecting lines */
function buildStepper(){
  stepperEl.innerHTML = '';
  questions.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'step-dot';
    dot.textContent = i + 1;
    dot.dataset.index = i;
    stepperEl.appendChild(dot);
    if (i < questions.length - 1){
      const line = document.createElement('div');
      line.className = 'step-line';
      stepperEl.appendChild(line);
    }
  });
}

function updateStepper(){
  const dots = stepperEl.querySelectorAll('.step-dot');
  const lines = stepperEl.querySelectorAll('.step-line');
  dots.forEach((dot, i) => {
    dot.classList.remove('done', 'active');
    if (i < current) dot.classList.add('done');
    else if (i === current) dot.classList.add('active');
  });
  lines.forEach((line, i) => {
    line.classList.toggle('done', i < current);
  });
}

function renderQuestion(){
  const q = questions[current];
  qEyebrow.textContent = 'السؤال ' + (current + 1);
  qText.textContent = q.text;
  progressCurrent.textContent = current + 1;

  qOptions.innerHTML = '';
  q.options.forEach((opt, i) => {
    const el = document.createElement('div');
    el.className = 'quiz-option' + (answers[current] === i ? ' selected' : '');
    el.innerHTML = '<span class="opt-radio"></span><span>' + opt + '</span>';
    el.addEventListener('click', () => {
      answers[current] = i;
      renderQuestion();
      updateFinishState();
    });
    qOptions.appendChild(el);
  });

  btnPrev.disabled = current === 0;
  btnNext.style.display = current === questions.length - 1 ? 'none' : 'inline-flex';

  updateStepper();
}

function updateFinishState(){
  const allAnswered = answers.every(a => a !== null);
  btnFinish.disabled = !allAnswered;
}

btnPrev.addEventListener('click', () => {
  if (current > 0){ current--; renderQuestion(); }
});
btnNext.addEventListener('click', () => {
  if (current < questions.length - 1){ current++; renderQuestion(); }
});
btnFinish.addEventListener('click', () => {
  if (btnFinish.disabled) return;
  questionView.style.display = 'none';
  doneView.style.display = 'block';
});

/* Init */
buildStepper();
renderQuestion();
updateFinishState();
</script>

</body>
</html>
