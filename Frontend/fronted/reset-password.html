<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعادة تعيين كلمة المرور — NextStep AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="../css/app.css" rel="stylesheet">
<link href="../css/header.css" rel="stylesheet">
<link href="../css/auth.css" rel="stylesheet">
<link href="../css/footer.css" rel="stylesheet">
</head>
<body>

<!-- ======================= HEADER ======================= -->
<script src="../js/header-index.js"></script>



<!-- ======================= AUTH CARD ======================= -->
<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-logo">
      <img src="../assets/logo.png" alt="NextStep AI" class="brand-logo">
      <div class="brand-text">NextStep <span>AI</span></div>
    </div>

    <div class="auth-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      إعادة تعيين كلمة المرور
    </div>

    <p class="auth-subtitle"> يرجى إدخال كلمة المرور الجديدة للوصول إلى حسابك  على الأكاديمية</p>

    <form id="resetForm">

      <!-- الإيميل يظهر للتأكيد فقط، معبّى تلقائياً من رابط إعادة التعيين -->
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <div class="input-icon-wrap">
          <input type="email" class="form-control" id="email" name="email" placeholder="example@email.com" required readonly>
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
        </div>
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور الجديدة</label>
        <div class="input-icon-wrap">
          <input type="password" class="form-control" id="password" name="password" placeholder="كلمة المرور الجديدة" required minlength="8">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <button type="button" class="toggle-password" data-target="password" aria-label="إظهار كلمة المرور">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a20.6 20.6 0 0 1-2.19 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="password_confirmation">تأكيد كلمة المرور</label>
        <div class="input-icon-wrap">
          <input type="password" class="form-control" id="password_confirmation" name="password_confirmation" placeholder="أعيدي كتابة كلمة المرور" required minlength="8">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <button type="button" class="toggle-password" data-target="password_confirmation" aria-label="إظهار كلمة المرور">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a20.6 20.6 0 0 1-2.19 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <!-- Checklist متطلبات كلمة المرور — تتحدث تلقائياً أثناء الكتابة -->
      <div class="requirements-box">
        <p class="req-title">متطلبات كلمة المرور:</p>
        <ul style="list-style:none; margin:0; padding:0;">
          <li class="requirement-item" id="reqLength">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
            8 أحرف على الأقل
          </li>
          <li class="requirement-item" id="reqNumber">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
            تحتوي على رقم واحد على الأقل
          </li>
          <li class="requirement-item" id="reqSymbol">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
            تحتوي على رمز خاص (@#$%^&amp;*)
          </li>
        </ul>
      </div>

      <button type="submit" class="btn-submit">
        حفظ كلمة المرور
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </button>
    </form>

    <p class="auth-footer-text">تذكرت كلمة المرور؟ <a href="login.html">تسجيل الدخول</a></p>
  </div>
</div>

<script>
  // ==========================================================================
  // إظهار / إخفاء كلمة المرور (زر العين)
  // ==========================================================================
  document.querySelectorAll('.toggle-password').forEach(btn => {
    btn.addEventListener('click', () => {
      const targetInput = document.getElementById(btn.dataset.target);
      const eyeIcon = btn.querySelector('.icon-eye');
      const eyeOffIcon = btn.querySelector('.icon-eye-off');
      const isHidden = targetInput.type === 'password';

      targetInput.type = isHidden ? 'text' : 'password';
      eyeIcon.style.display = isHidden ? 'none' : 'block';
      eyeOffIcon.style.display = isHidden ? 'block' : 'none';
      btn.setAttribute('aria-label', isHidden ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
    });
  });

  // ==========================================================================
  // متطلبات كلمة المرور — تحديث حي أثناء الكتابة
  // ==========================================================================
  const passwordInput = document.getElementById('password');
  const reqLength = document.getElementById('reqLength');
  const reqNumber = document.getElementById('reqNumber');
  const reqSymbol = document.getElementById('reqSymbol');

  function updateRequirement(el, isMet) {
    el.classList.toggle('met', isMet);
  }

  passwordInput.addEventListener('input', () => {
    const val = passwordInput.value;
    updateRequirement(reqLength, val.length >= 8);
    updateRequirement(reqNumber, /\d/.test(val));
    updateRequirement(reqSymbol, /[@#$%^&*!.,_\-+=]/.test(val));
  });

  const API_BASE_URL = 'http://127.0.0.1:8000/api';

  const resetForm = document.getElementById('resetForm');
  const submitBtn = resetForm.querySelector('.btn-submit');
  const emailInput = document.getElementById('email');

  const alertBox = document.createElement('div');
  alertBox.id = 'resetAlert';
  alertBox.style.cssText = 'display:none;margin-bottom:16px;padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;';
  resetForm.prepend(alertBox);

  function showAlert(message, type) {
    alertBox.textContent = message;
    alertBox.style.display = 'block';
    if (type === 'error') {
      alertBox.style.background = '#FDEDEE';
      alertBox.style.color = '#C62828';
    } else {
      alertBox.style.background = 'rgba(72,230,176,0.12)';
      alertBox.style.color = '#1C8F63';
    }
  }

  // ==========================================================================
  // قراءة token و email من رابط إعادة التعيين
  // الرابط المتوقع من الإيميل يكون بالشكل:
  // reset-password.html?token=XXXXXXXX&email=user@example.com
  // ==========================================================================
  const urlParams = new URLSearchParams(window.location.search);
  const resetToken = urlParams.get('token');
  const resetEmail = urlParams.get('email');

  if (resetEmail) {
    emailInput.value = resetEmail;
  }

  if (!resetToken || !resetEmail) {
    showAlert('رابط إعادة التعيين غير صالح أو منتهي الصلاحية. قم بطلب رابط جديد.', 'error');
    submitBtn.disabled = true;
  }

  resetForm.addEventListener('submit', async function (e) {
    e.preventDefault();

    const password = document.getElementById('password').value;
    const passwordConfirmation = document.getElementById('password_confirmation').value;

    if (password !== passwordConfirmation) {
      showAlert('كلمتا المرور غير متطابقتين', 'error');
      return;
    }

    const payload = {
      token: resetToken,
      email: resetEmail,
      password: password,
      password_confirmation: passwordConfirmation,
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'جارٍ الحفظ...';
    alertBox.style.display = 'none';

    try {
      const response = await fetch(`${API_BASE_URL}/reset-password`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json',
        },
        body: JSON.stringify(payload),
      });

      const data = await response.json();

      if (response.ok && data.status === 'success') {
        showAlert('تم تغيير كلمة المرور بنجاح! جارٍ تحويلك لتسجيل الدخول...', 'success');
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      } else {
        const errorMsg = data.message || 'تعذر تغيير كلمة المرور، تأكد إنه الرابط لسا صالح وحاول مرة ثانية';
        showAlert(errorMsg, 'error');
        submitBtn.disabled = false;
      }
    } catch (err) {
      showAlert('تعذر الاتصال بالسيرفر. تأكدي إنه الباك اند شغال.', 'error');
      console.error('Reset password error:', err);
      submitBtn.disabled = false;
    } finally {
      submitBtn.innerHTML = 'حفظ كلمة المرور <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>';
    }
  });
</script>


<!-- ======================= FOOTER ======================= -->

<script src="../js/footer-index.js"></script>
</body>
</html>
