<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب طالب — NextStep AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/header.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/auth-extra.css">
    <link rel="stylesheet" href="../css/auth-updates.css">
    <link rel="stylesheet" href="../css/footer.css">
</head>

<body>

<!-- ======================= HEADER ======================= -->
<script src="../js/header-index.js"></script>

<!-- BACKGROUND -->
<div class="auth-background">
    <div class="background-grid"></div>
</div>

<main class="auth-shell">

    <!-- =====================================================
         LEFT (first) — SIGNUP FORM
         نفس ترتيب صفحة تسجيل الدخول: الفورم أول عنصر بالـ DOM
         عشان .auth-shell شغالة بـ direction:ltr، فأول عنصر
         بيطلع عالشمال والتاني عاليمين
    ====================================================== -->
    <section class="auth-form-side">

        <div class="login-content">

            <div class="welcome">
                <h1>أنشئ حسابك ✨</h1>
                <p id="trackGoal">اختر مسارك، واكتشف مسارك الجامعي أو المهني المناسب</p>
            </div>

            <form id="signupForm" class="login-form">

                <!-- اختيار المسار -->
                <div class="form-group">
                    <label class="form-label">اختر مسارك</label>
                    <div class="type-toggle">
                        <button type="button" class="type-btn active" data-track="new_student">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z"/><path d="M6 12v5c0 1.5 2.5 3 6 3s6-1.5 6-3v-5"/></svg>
                            طالب جديد
                        </button>
                        <button type="button" class="type-btn" data-track="university_student">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M9 17h1M14 17h1"/></svg>
                            طالب جامعي
                        </button>
                    </div>
                    <input type="hidden" id="track" name="track" value="new_student">
                </div>

                <!-- الاسم + رقم الهاتف -->
                <div class="form-row-2">
                    <div class="form-group">
                        <label class="form-label" for="name">الاسم الكامل</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                            </span>
                            <input type="text" class="form-input" id="name" name="name" placeholder="أدخل اسمك الكامل" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="phone">رقم الهاتف</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.77.62 2.6a2 2 0 0 1-.45 2.11L8.09 9.62a16 16 0 0 0 6 6l1.19-1.19a2 2 0 0 1 2.11-.45c.83.29 1.7.5 2.6.62A2 2 0 0 1 22 16.92z"/></svg>
                            </span>
                            <input type="tel" class="form-input" id="phone" name="phone" placeholder="05xxxxxxxx" required>
                        </div>
                    </div>
                </div>

                <!-- الإيميل + المدينة -->
                <div class="form-row-2">
                    <div class="form-group">
                        <label class="form-label" for="email">البريد الإلكتروني</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
                            </span>
                            <input type="email" class="form-input" id="email" name="email" placeholder="example@email.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="city">المدينة <span class="optional">(اختياري)</span></label>
                        <select class="form-input" id="city" name="city">
                            <option value="">-- اختر المدينة --</option>
                            <option value="نابلس">نابلس</option>
                            <option value="رام الله">رام الله</option>
                            <option value="الخليل">الخليل</option>
                            <option value="جنين">جنين</option>
                            <option value="بيت لحم">بيت لحم</option>
                        </select>
                    </div>
                </div>

                <!-- كلمة المرور + تأكيدها -->
                <div class="form-row-2">
                    <div class="form-group">
                        <label class="form-label" for="password">كلمة المرور</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
                            </span>
                            <input type="password" class="form-input" id="password" name="password" placeholder="كلمة المرور الجديدة" required minlength="8">
                            <button type="button" class="password-toggle toggle-password" data-target="password" aria-label="إظهار كلمة المرور">
                                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.5"/></svg>
                                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="display:none;"><path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 102.8 2.8"/><path d="M9.9 5.2C10.6 5.1 11.3 5 12 5c6 0 9.5 7 9.5 7-.8 1.7-2 3.1-3.5 4.2M6.1 6.2C3.7 8 2.5 12 2.5 12c.9 1.7 2.2 3.2 3.8 4.4"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password_confirmation">تأكيد كلمة المرور</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
                            </span>
                            <input type="password" class="form-input" id="password_confirmation" name="password_confirmation" placeholder="أعيد كتابة كلمة المرور" required>
                            <button type="button" class="password-toggle toggle-password" data-target="password_confirmation" aria-label="إظهار كلمة المرور">
                                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.5"/></svg>
                                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="display:none;"><path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 102.8 2.8"/><path d="M9.9 5.2C10.6 5.1 11.3 5 12 5c6 0 9.5 7 9.5 7-.8 1.7-2 3.1-3.5 4.2M6.1 6.2C3.7 8 2.5 12 2.5 12c.9 1.7 2.2 3.2 3.8 4.4"/></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- ======= مسار: طالب جديد ======= -->
                <div class="conditional-fields" data-show-for="new_student">

                    <div class="form-row-2">
                        <div class="form-group">
                            <label class="form-label" for="age">العمر</label>
                            <div class="input-wrapper">
                                <span class="input-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                                </span>
                                <input type="number" class="form-input" id="age" name="age" placeholder="20" min="14" max="60" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="high_school_score">المعدل</label>
                            <div class="input-wrapper">
                                <span class="input-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2l2.9 6.3L22 9l-5 5 1.2 7L12 17.8 5.8 21 7 14 2 9l7.1-.7z"/></svg>
                                </span>
                                <input type="number" class="form-input" id="high_school_score" name="high_school_score" placeholder="95.0" min="0" max="100" step="0.1" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-row-2">
                        <div class="form-group">
                            <label class="form-label" for="high_school_branch_id">الفرع الدراسي</label>
                            <select class="form-input" id="high_school_branch_id" name="high_school_branch_id" required>
                                <option value="">-- اختر الفرع --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="inclination_id">الميول</label>
                            <select class="form-input" id="inclination_id" name="inclination_id" required>
                                <option value="">-- اختر الميول --</option>
                            </select>
                        </div>
                    </div>

                </div>

                <!-- ======= مسار: طالب جامعي ======= -->
                <div class="conditional-fields" data-show-for="university_student" style="display:none;">

                    <div class="form-row-2">
                        <div class="form-group">
                            <label class="form-label" for="university_id">الجامعة الحالية</label>
                            <select class="form-input" id="university_id" name="university_id">
                                <option value="">-- اختر الجامعة --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="major_id">التخصص الحالي</label>
                            <select class="form-input" id="major_id" name="major_id" disabled>
                                <option value="">-- اختر الجامعة أولاً --</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row-2">
                        <div class="form-group">
                            <label class="form-label" for="academic_level">السنة الدراسية / المستوى</label>
                            <select class="form-input" id="academic_level" name="academic_level">
                                <option value="">-- اختر المستوى --</option>
                                <option value="1">السنة الأولى</option>
                                <option value="2">السنة الثانية</option>
                                <option value="3">السنة الثالثة</option>
                                <option value="4">السنة الرابعة</option>
                                <option value="5">السنة الخامسة فأكثر</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="gpa">المعدل التراكمي <span class="optional">(اختياري)</span></label>
                            <div class="input-wrapper">
                                <span class="input-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2l2.9 6.3L22 9l-5 5 1.2 7L12 17.8 5.8 21 7 14 2 9l7.1-.7z"/></svg>
                                </span>
                                <input type="number" class="form-input" id="gpa" name="gpa" placeholder="3.2" min="0" max="4" step="0.01">
                            </div>
                        </div>
                    </div>

                </div>

                <button type="submit" class="login-button">
                    <span>إنشاء الحساب <span aria-hidden="true">←</span></span>
                </button>

                <p class="signup-text">
                    لديك حساب بالفعل؟
                    <a href="login.html">تسجيل الدخول</a>
                </p>

            </form>

        </div>

    </section>

    <!-- =====================================================
         RIGHT (second) — NEXTSTEP HERO
    ====================================================== -->
           <section class="auth-hero">

            <div class="hero-brand">

            
           

            </div>

            <div class="hero-copy">

                <span class="hero-eyebrow">
                    NEXTSTEP AI · ACADEMIC GUIDANCE
                </span>

                <h2 class="hero-title">
                    منصتك الذكية
                    <span class="blue">لمستقبلك الأكاديمي</span>
                </h2>

                <p class="hero-description">
                    تابع من حيث توقفت — نتائج اختباراتك، توصياتك،
                    وخطتك الدراسية كلها بانتتظارك .
                </p>

            </div>

            <div class="logo-stage" aria-hidden="true">

                <span class="orbit orbit-one"></span>
                <span class="orbit orbit-two"></span>

                <span class="podium podium-back"></span>
                <span class="podium podium-front"></span>

                <span class="logo-halo"></span>

                <img
                    src="../assets/img/logo.png"
                    alt=""
                    class="nextstep-logo-img"
                >

            </div>

            <div class="hero-features">

                <div class="feature">
                    <div class="feature-icon">
                        <svg viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.7">
                            <circle cx="12" cy="12" r="8"/>
                            <path d="M12 8v5l3 2"/>
                        </svg>
                    </div>
                    <span class="feature-title">مرشد ذكي دائم</span>
                </div>

                <div class="feature">
                    <div class="feature-icon">
                        <svg viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.7">
                            <rect x="5" y="4" width="14" height="16" rx="2"/>
                            <path d="M8 8h8"/>
                            <path d="M8 12h8"/>
                            <path d="M8 16h5"/>
                        </svg>
                    </div>
                    <span class="feature-title">خطة تطور مهاراتك</span>
                </div>

                <div class="feature">
                    <div class="feature-icon">
                        <svg viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.7">
                            <path d="M7 17L17 7"/>
                            <path d="M10 7h7v7"/>
                        </svg>
                    </div>
                    <span class="feature-title">توصيات محفوظة</span>
                </div>

            </div>

        </section>

</main>

<script>
    const trackBtns = document.querySelectorAll('.type-btn');
    const trackInput = document.getElementById('track');
    const trackGoalText = document.getElementById('trackGoal');
    const newStudentFields = document.querySelector('.conditional-fields[data-show-for="new_student"]');
    const universityFields = document.querySelector('.conditional-fields[data-show-for="university_student"]');

    const goals = {
        new_student: 'الهدف: اختيار تخصص وجامعة مناسبة',
        university_student: 'الهدف: تطوير المسار الأكاديمي والمهني أثناء الدراسة'
    };

    function setRequiredWithin(container, isRequired) {
        container.querySelectorAll('input, select').forEach(field => {
            if (field.id === 'gpa') return;
            if (field.id === 'major_id') return;
            field.required = isRequired;
        });
    }

    trackBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            trackBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const track = btn.dataset.track;
            trackInput.value = track;
            trackGoalText.textContent = goals[track];

            if (track === 'new_student') {
                newStudentFields.style.display = 'block';
                universityFields.style.display = 'none';
                setRequiredWithin(newStudentFields, true);
                setRequiredWithin(universityFields, false);
            } else {
                newStudentFields.style.display = 'none';
                universityFields.style.display = 'block';
                setRequiredWithin(newStudentFields, false);
                setRequiredWithin(universityFields, true);
            }
        });
    });

    /* إظهار / إخفاء كلمة المرور */
    document.querySelectorAll('.toggle-password').forEach(btn => {
        btn.addEventListener('click', () => {
            const targetInput = document.getElementById(btn.dataset.target);
            const eyeIcon = btn.querySelector('.icon-eye');
            const eyeOffIcon = btn.querySelector('.icon-eye-off');
            const isHidden = targetInput.type === 'password';

            targetInput.type = isHidden ? 'text' : 'password';
            eyeIcon.style.display = isHidden ? 'none' : 'block';
            eyeOffIcon.style.display = isHidden ? 'block' : 'none';
            btn.setAttribute('aria-label', isHidden ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
        });
    });

    /* ربط الفورم بـ API التسجيل */
    const API_BASE_URL = 'http://127.0.0.1:8000/api';

    const signupForm = document.getElementById('signupForm');
    const submitBtn = signupForm.querySelector('.login-button');

    const alertBox = document.createElement('div');
    alertBox.id = 'signupAlert';
    alertBox.style.cssText = 'display:none;margin-bottom:16px;padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;text-align:center;';
    signupForm.prepend(alertBox);

    function showAlert(message, type) {
        alertBox.textContent = message;
        alertBox.style.display = 'block';
        if (type === 'error') {
            alertBox.style.background = '#FDEDEE';
            alertBox.style.color = '#C62828';
        } else {
            alertBox.style.background = 'rgba(75,230,176,0.12)';
            alertBox.style.color = '#1C8F63';
        }
    }

    async function loadInitialLookups() {
        try {
            const branchesRes = await fetch(`${API_BASE_URL}/lookups/branches`, { headers: { 'Accept': 'application/json' } });
            const branchesData = await branchesRes.json();
            if (branchesRes.ok && branchesData.status === 'success') {
                const branchSelect = document.getElementById('high_school_branch_id');
                branchSelect.innerHTML = '<option value="">-- اختر الفرع --</option>';
                branchesData.data.forEach(branch => {
                    branchSelect.innerHTML += `<option value="${branch.id}">${branch.name}</option>`;
                });
            }

            const inclinationsRes = await fetch(`${API_BASE_URL}/lookups/inclinations`, { headers: { 'Accept': 'application/json' } });
            const inclinationsData = await inclinationsRes.json();
            if (inclinationsRes.ok && inclinationsData.status === 'success') {
                const inclSelect = document.getElementById('inclination_id');
                inclSelect.innerHTML = '<option value="">-- اختر الميول --</option>';
                inclinationsData.data.forEach(item => {
                    inclSelect.innerHTML += `<option value="${item.id}">${item.name}</option>`;
                });
            }

            const unisRes = await fetch(`${API_BASE_URL}/universities`, { headers: { 'Accept': 'application/json' } });
            const unisData = await unisRes.json();
            if (unisRes.ok && unisData.status === 'success') {
                const uniSelect = document.getElementById('university_id');
                uniSelect.innerHTML = '<option value="">-- اختر الجامعة --</option>';
                unisData.data.forEach(uni => {
                    uniSelect.innerHTML += `<option value="${uni.id}">${uni.name}</option>`;
                });
            }
        } catch (err) {
            console.error('خطأ في جلب البيانات الأولية:', err);
        }
    }

    const universitySelect = document.getElementById('university_id');
    const majorSelect = document.getElementById('major_id');

    universitySelect.addEventListener('change', async function () {
        const universityId = this.value;
        majorSelect.innerHTML = '<option value="">--  المطلوب اختر التخصص --</option>';

        if (!universityId) {
            majorSelect.disabled = true;
            majorSelect.innerHTML = '<option value="">-- اختر الجامعة أولاً --</option>';
            return;
        }

        try {
            majorSelect.disabled = true;
            majorSelect.innerHTML = '<option value="">جاري تحميل التخصصات...</option>';

            const response = await fetch(`${API_BASE_URL}/lookups/universities/${universityId}/majors`, { headers: { 'Accept': 'application/json' } });
            const result = await response.json();

            if (response.ok && result.status === 'success') {
                majorSelect.innerHTML = '<option value="">-- اختر التخصص --</option>';
                if (result.data.length === 0) {
                    majorSelect.innerHTML = '<option value="">لا توجد تخصصات متاحة لهذه الجامعة</option>';
                    return;
                }
                result.data.forEach(major => {
                    majorSelect.innerHTML += `<option value="${major.id}">${major.title}</option>`;
                });
                majorSelect.disabled = false;
            } else {
                majorSelect.innerHTML = '<option value="">فشل جلب التخصصات</option>';
            }
        } catch (err) {
            console.error('خطأ في جلب تخصصات الجامعة:', err);
            majorSelect.innerHTML = '<option value="">خطأ في الاتصال</option>';
        }
    });

    document.addEventListener('DOMContentLoaded', loadInitialLookups);

    signupForm.addEventListener('submit', async function (e) {
        e.preventDefault();

        const track = document.getElementById('track').value;

        const payload = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            password: document.getElementById('password').value,
            password_confirmation: document.getElementById('password_confirmation').value,
            student_type: track,
            city: document.getElementById('city').value || null,
        };

        if (track === 'new_student') {
            payload.age = document.getElementById('age').value;
            payload.high_school_branch_id = document.getElementById('high_school_branch_id').value;
            payload.inclination_id = document.getElementById('inclination_id').value;
            payload.high_school_score = document.getElementById('high_school_score').value;
        } else if (track === 'university_student') {
            payload.university_id = document.getElementById('university_id').value;
            payload.major_id = document.getElementById('major_id').value;
            payload.academic_level = document.getElementById('academic_level').value;
            const gpaVal = document.getElementById('gpa').value;
            if (gpaVal) payload.gpa = gpaVal;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>جارٍ الإنشاء...</span>';
        alertBox.style.display = 'none';

        try {
            const response = await fetch(`${API_BASE_URL}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify(payload),
            });

            const data = await response.json();

            if (response.ok && data.status === 'success') {
                localStorage.setItem('auth_token', data.data.token);
                showAlert('تم إنشاء الحساب بنجاح! جارٍ التحويل...', 'success');
                setTimeout(() => { window.location.href = 'quiz.html'; }, 1200);
            } else {
                const errorMsg = data.message || 'حدث خطأ، تأكد من البيانات وحاولي مرة ثانية';
                showAlert(errorMsg, 'error');
            }
        } catch (err) {
            showAlert('تعذر الاتصال بالسيرفر. تأكد إنه الباك اند شغال.', 'error');
            console.error('Register error:', err);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>إنشاء الحساب <span aria-hidden="true">←</span></span>';
        }
    });
</script>
