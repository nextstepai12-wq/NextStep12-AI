<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب طالب — NextStep AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="../css/app.css" rel="stylesheet">
<link href="../css/header.css" rel="stylesheet">
<link href="../css/signup.css" rel="stylesheet">
<link href="../css/footer.css" rel="stylesheet">
</head>
<body>

<!-- ======================= HEADER ======================= -->
<script src="header.js?v=2"></script>

<!-- ======================= AUTH CARD ======================= -->
<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-logo">
      <img src="../assets/logo.png" alt="NextStep AI" class="brand-logo">
      <div class="brand-text">NextStep <span>AI</span></div>
    </div>

 
    <h1 class="auth-title">أنشئ حسابك</h1>
    <p class="auth-subtitle" id="trackGoal">اختر مسارك، واكتشف مسارك الجامعي أو المهني المناسب</p>

    <form id="signupForm">

      <!-- اختيار المسار -->
      <div class="form-group">
        <label>اختر مسارك</label>
        <div class="type-toggle">
          <button type="button" class="type-btn active" data-track="new_student">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z"/><path d="M6 12v5c0 1.5 2.5 3 6 3s6-1.5 6-3v-5"/></svg>
            طالب جديد
          </button>
          <button type="button" class="type-btn" data-track="university_student">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M9 17h1M14 17h1"/></svg>
            طالب جامعي
          </button>
        </div>
        <input type="hidden" id="track" name="track" value="new_student">
      </div>

      <div class="form-group">
        <label for="name">الاسم الكامل</label>
        <div class="input-icon-wrap">
          <input type="text" class="form-control" id="name" name="name" placeholder="أدخل اسمك الكامل" required>
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        </div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <div class="input-icon-wrap">
            <input type="email" class="form-control" id="email" name="email" placeholder="example@email.com" required>
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
          </div>
        </div>
        <div class="form-group">
          <label for="phone">رقم الهاتف</label>
          <div class="input-icon-wrap">
            <input type="tel" class="form-control" id="phone" name="phone" placeholder="05xxxxxxxx" required>
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.77.62 2.6a2 2 0 0 1-.45 2.11L8.09 9.62a16 16 0 0 0 6 6l1.19-1.19a2 2 0 0 1 2.11-.45c.83.29 1.7.5 2.6.62A2 2 0 0 1 22 16.92z"/></svg>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور الجديدة</label>
        <div class="input-icon-wrap">
          <input type="password" class="form-control" id="password" name="password" placeholder="كلمة المرور الجديدة" required minlength="8">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <button type="button" class="toggle-password" data-target="password" aria-label="إظهار كلمة المرور">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a20.6 20.6 0 0 1-2.19 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="password_confirmation">تأكيد كلمة المرور</label>
        <div class="input-icon-wrap">
          <input type="password" class="form-control" id="password_confirmation" name="password_confirmation" placeholder="أعيد كتابة كلمة المرور" required>
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <button type="button" class="toggle-password" data-target="password_confirmation" aria-label="إظهار كلمة المرور">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a20.6 20.6 0 0 1-2.19 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <!-- ======================= المسار الأول: طالب جديد (توجيه لأول مرة) ======================= -->
      <div class="conditional-fields" data-show-for="new_student">

        <div class="form-row-2">
          <div class="form-group">
            <label for="age">العمر</label>
            <div class="input-icon-wrap">
              <input type="number" class="form-control" id="age" name="age" placeholder="20" min="14" max="60" required>
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            </div>
          </div>
          <div class="form-group">
            <label for="high_school_score">المعدل</label>
            <div class="input-icon-wrap">
              <input type="number" class="form-control" id="high_school_score" name="high_school_score" placeholder="95.0" min="0" max="100" step="0.1" required>
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.9 6.3L22 9l-5 5 1.2 7L12 17.8 5.8 21 7 14 2 9l7.1-.7z"/></svg>
            </div>
          </div>
        </div>

        <!-- الفرع الدراسي — يُجلب ديناميكياً من API -->
        <div class="form-group">
          <label for="high_school_branch_id">الفرع الدراسي</label>
          <select class="form-control" id="high_school_branch_id" name="high_school_branch_id" required>
            <option value="">-- اختر الفرع --</option>
          </select>
        </div>

        <!-- الميول — يُجلب ديناميكياً من API (id/name مختلفان الآن عن الفرع) -->
        <div class="form-group">
          <label for="inclination_id">الميول</label>
          <select class="form-control" id="inclination_id" name="inclination_id" required>
            <option value="">-- اختر الميول --</option>
          </select>
        </div>

      </div>
      <!-- ======================= المسار الثاني: طالب جامعي (إرشاد ومتابعة) ======================= -->
      <div class="conditional-fields" data-show-for="university_student" style="display:none;">

        <div class="form-row-2">
          <!-- الجامعة الحالية — تُجلب ديناميكياً من API -->
          <div class="form-group">
            <label for="university_id">الجامعة الحالية</label>
            <select class="form-control" id="university_id" name="university_id">
              <option value="">-- اختر الجامعة --</option>
            </select>
          </div>
          <!-- التخصص الحالي — يُجلب ديناميكياً حسب الجامعة المختارة -->
          <div class="form-group">
            <label for="major_id">التخصص الحالي</label>
            <select class="form-control" id="major_id" name="major_id" disabled>
              <option value="">-- اختر الجامعة أولاً --</option>
            </select>
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label for="academic_level">السنة الدراسية / المستوى</label>
            <select class="form-control" id="academic_level" name="academic_level">
              <option value="">-- اختر المستوى --</option>
              <option value="1">السنة الأولى</option>
              <option value="2">السنة الثانية</option>
              <option value="3">السنة الثالثة</option>
              <option value="4">السنة الرابعة</option>
              <option value="5">السنة الخامسة فأكثر</option>
            </select>
          </div>
          <div class="form-group">
            <label for="gpa">المعدل التراكمي <span class="optional">(اختياري)</span></label>
            <div class="input-icon-wrap">
              <input type="number" class="form-control" id="gpa" name="gpa" placeholder="3.2" min="0" max="4" step="0.01">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.9 6.3L22 9l-5 5 1.2 7L12 17.8 5.8 21 7 14 2 9l7.1-.7z"/></svg>
            </div>
          </div>
        </div>

      </div>

      <div class="form-group">
        <label for="city">المدينة <span class="optional">(اختياري)</span></label>
        <select class="form-control" id="city" name="city">
          <option value="">-- اختر المدينة --</option>
          <option value="نابلس">نابلس</option>
          <option value="رام الله">رام الله</option>
          <option value="الخليل">الخليل</option>
          <option value="جنين">جنين</option>
          <option value="بيت لحم">بيت لحم</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">
        إنشاء الحساب
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </button>
    </form>

    <p class="auth-footer-text">لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
  </div>
</div>

<script>
  const trackBtns = document.querySelectorAll('.type-btn');
  const trackInput = document.getElementById('track');
  const trackGoalText = document.getElementById('trackGoal');
  const newStudentFields = document.querySelector('.conditional-fields[data-show-for="new_student"]');
  const universityFields = document.querySelector('.conditional-fields[data-show-for="university_student"]');

  const goals = {
    new_student: 'الهدف: اختيار تخصص وجامعة مناسبة',
    university_student: 'الهدف: تطوير المسار الأكاديمي والمهني أثناء الدراسة'
  };

  function setRequiredWithin(container, isRequired){
    container.querySelectorAll('input, select').forEach(field => {
      // المعدل التراكمي والتخصص بمسار الطالب الجامعي معالجان بشكل خاص
      if (field.id === 'gpa') return;
      if (field.id === 'major_id') return;
      field.required = isRequired;
    });
  }

  trackBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      trackBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const track = btn.dataset.track;
      trackInput.value = track;
      trackGoalText.textContent = goals[track];

      if (track === 'new_student'){
        newStudentFields.style.display = 'block';
        universityFields.style.display = 'none';
        setRequiredWithin(newStudentFields, true);
        setRequiredWithin(universityFields, false);
      } else {
        newStudentFields.style.display = 'none';
        universityFields.style.display = 'block';
        setRequiredWithin(newStudentFields, false);
        setRequiredWithin(universityFields, true);
      }
    });
  });

  // ==========================================================================
  // إظهار / إخفاء كلمة المرور (زر العين)
  // ==========================================================================
  document.querySelectorAll('.toggle-password').forEach(btn => {
    btn.addEventListener('click', () => {
      const targetInput = document.getElementById(btn.dataset.target);
      const eyeIcon = btn.querySelector('.icon-eye');
      const eyeOffIcon = btn.querySelector('.icon-eye-off');
      const isHidden = targetInput.type === 'password';

      targetInput.type = isHidden ? 'text' : 'password';
      eyeIcon.style.display = isHidden ? 'none' : 'block';
      eyeOffIcon.style.display = isHidden ? 'block' : 'none';
      btn.setAttribute('aria-label', isHidden ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
    });
  });

  // ==========================================================================
  // ربط الفورم بـ API التسجيل (عمر) — POST /api/register
  // ==========================================================================

  // عنوان الباك اند — عدّليه حسب وين شغال عندك (php artisan serve أو WAMP)
  const API_BASE_URL = 'http://127.0.0.1:8000/api';

  const signupForm = document.getElementById('signupForm');
  const submitBtn = signupForm.querySelector('.btn-submit');

  const alertBox = document.createElement('div');
  alertBox.id = 'signupAlert';
  alertBox.style.cssText = 'display:none;margin-bottom:16px;padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;';
  signupForm.prepend(alertBox);

  function showAlert(message, type) {
    alertBox.textContent = message;
    alertBox.style.display = 'block';
    if (type === 'error') {
      alertBox.style.background = '#FDEDEE';
      alertBox.style.color = '#C62828';
    } else {
      alertBox.style.background = 'rgba(72,230,176,0.12)';
      alertBox.style.color = '#1C8F63';
    }
  }

  // ==========================================================================
  // جلب القوائم الديناميكية من الـ LookupController
  // ==========================================================================

  // 1. جلب فروع الثانوية، الميول، والجامعات عند تحميل الصفحة
  async function loadInitialLookups() {
    try {
      // أ) جلب فروع الثانوية العامة
      const branchesRes = await fetch(`${API_BASE_URL}/lookups/branches`, {
        headers: { 'Accept': 'application/json' }
      });
      const branchesData = await branchesRes.json();

      if (branchesRes.ok && branchesData.status === 'success') {
        const branchSelect = document.getElementById('high_school_branch_id');
        branchSelect.innerHTML = '<option value="">-- اختر الفرع --</option>';
        branchesData.data.forEach(branch => {
          branchSelect.innerHTML += `<option value="${branch.id}">${branch.name}</option>`;
        });
      }

      // ب) جلب الميول — عدّلي المسار حسب ما هو مسجّل فعلياً بـ routes/api.php
      const inclinationsRes = await fetch(`${API_BASE_URL}/lookups/inclinations`, {
        headers: { 'Accept': 'application/json' }
      });
      const inclinationsData = await inclinationsRes.json();

      if (inclinationsRes.ok && inclinationsData.status === 'success') {
        const inclSelect = document.getElementById('inclination_id');
        inclSelect.innerHTML = '<option value="">-- اختر الميول --</option>';
        inclinationsData.data.forEach(item => {
          inclSelect.innerHTML += `<option value="${item.id}">${item.name}</option>`;
        });
      }

      // ج) جلب قائمة الجامعات — ملاحظة: مش تحت /lookups لأنه مسجّلة كمسار منفصل بـ routes/api.php
      const unisRes = await fetch(`${API_BASE_URL}/universities`, {
        headers: { 'Accept': 'application/json' }
      });
      const unisData = await unisRes.json();

      if (unisRes.ok && unisData.status === 'success') {
        const uniSelect = document.getElementById('university_id');
        uniSelect.innerHTML = '<option value="">-- اختر الجامعة --</option>';
        unisData.data.forEach(uni => {
          uniSelect.innerHTML += `<option value="${uni.id}">${uni.name}</option>`;
        });
      }

    } catch (err) {
      console.error('خطأ في جلب البيانات الأولية:', err);
    }
  }

  // 2. جلب التخصصات الخاصة بالجامعة المحددة فقط عند تغيير الاختيار
  const universitySelect = document.getElementById('university_id');
  const majorSelect = document.getElementById('major_id');

  universitySelect.addEventListener('change', async function () {
    const universityId = this.value;

    // تفريغ قائمة التخصصات وإعادة تعطيلها إذا لم يتم اختيار جامعة
    majorSelect.innerHTML = '<option value="">-- اختر التخصص --</option>';

    if (!universityId) {
      majorSelect.disabled = true;
      majorSelect.innerHTML = '<option value="">-- اختر الجامعة أولاً --</option>';
      return;
    }

    try {
      majorSelect.disabled = true;
      majorSelect.innerHTML = '<option value="">جاري تحميل التخصصات...</option>';

      const response = await fetch(`${API_BASE_URL}/lookups/universities/${universityId}/majors`, {
        headers: { 'Accept': 'application/json' }
      });
      const result = await response.json();

      if (response.ok && result.status === 'success') {
        majorSelect.innerHTML = '<option value="">-- اختر التخصص --</option>';

        if (result.data.length === 0) {
          majorSelect.innerHTML = '<option value="">لا توجد تخصصات متاحة لهذه الجامعة</option>';
          return;
        }

        // لاحظي استخدام item.title بدلاً من item.name حسب الـ Controller
        result.data.forEach(major => {
          majorSelect.innerHTML += `<option value="${major.id}">${major.title}</option>`;
        });

        majorSelect.disabled = false;
      } else {
        majorSelect.innerHTML = '<option value="">فشل جلب التخصصات</option>';
      }
    } catch (err) {
      console.error('خطأ في جلب تخصصات الجامعة:', err);
      majorSelect.innerHTML = '<option value="">خطأ في الاتصال</option>';
    }
  });
/**
  // تشغيل الجلب الأولي عند فتح الصفحة
  //document.addEventListener('DOMContentLoaded', loadInitialLookups);

  signupForm.addEventListener('submit', async function (e) {
    e.preventDefault();

    const track = document.getElementById('track').value;

    const payload = {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
      password: document.getElementById('password').value,
      password_confirmation: document.getElementById('password_confirmation').value,
      student_type: track,
      city: document.getElementById('city').value || null,
    };

    if (track === 'new_student') {
      payload.age = document.getElementById('age').value;
      payload.high_school_branch_id = document.getElementById('high_school_branch_id').value;
      payload.inclination_id = document.getElementById('inclination_id').value;
      payload.high_school_score = document.getElementById('high_school_score').value;
    } else if (track === 'university_student') {
      payload.university_id = document.getElementById('university_id').value;
      payload.major_id = document.getElementById('major_id').value;
      payload.academic_level = document.getElementById('academic_level').value;

        payload.gpa = gpaVal;
      }
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'جارٍ الإنشاء...';

    try {
      const response = await fetch(`${API_BASE_URL}/register`, {
        method: 'POST',

          'Content-Type': 'application/json',
          'Accept': 'application/json',

      if (response.ok && data.status === 'success') {
        localStorage.setItem('auth_token', data.data.token);

        setTimeout(() => { window.location.href = 'quiz.html'; }, 1200);
      } else {
        const errorMsg = data.message || 'حدث خطأ، تأكدي من البيانات وحاولي مرة ثانية';

      showAlert('تعذر الاتصال بالسيرفر. تأكدي إنه الباك اند شغال.', 'error');
      console.error('Register error:', err);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'إنشاء الحساب <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>';
    }
  }); **/
</script>

<!-- ======================= FOOTER ======================= -->

<script src="footer.js"></script>

</body>
</html>
