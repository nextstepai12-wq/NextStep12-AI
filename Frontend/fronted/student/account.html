  <main class="page-content">
    <div class="page-header">
      <div>
        <span class="eyebrow">مساحتك الشخصية</span>
        <h1>حسابي</h1>
        <p>احفظ تفضيلاتك وتابع الفرص التي تناسب خطوتك القادمة.</p>
      </div>
    </div>

    <div class="profile-layout">
      <section class="profile-card">
        <div class="profile-summary">
          <span class="profile-avatar">م</span>
          <div>
            <h2>مرحبًا بك</h2>
            <p>طالب/ـة طموح/ـة</p>
          </div>
        </div>
        <a class="brand-button" href="code_1788174249460.html">تصفح المنح</a>
      </section>

      <section class="profile-card">
        <h2>تفضيلاتك الدراسية</h2>

        <div class="form-row">
          <label for="stage">المرحلة الدراسية</label>
          <select id="stage">
            <option>اختر المرحلة</option>
            <option>بكالوريوس</option>
            <option>ماجستير</option>
            <option>دكتوراة</option>
          </select>
        </div>
        <div class="form-row">
          <label for="major">التخصص المفضل</label>
          <input id="major" type="text" placeholder="مثال: علوم الحاسب">
        </div>
        <div class="form-row">
          <label for="country">الدولة المفضلة</label>
          <input id="country" type="text" placeholder="مثال: المملكة العربية السعودية">
        </div>
        <div class="hero-actions">
          <button class="brand-button" type="button">حفظ التفضيلات</button>
